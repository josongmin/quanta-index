[workspace]
members = [
    "crates/quanta-index-contract",
    "crates/quanta-index-contract-base",
    "crates/quanta-index-core",
    "crates/quanta-index-lexical",
    "crates/quanta-index-repomap",
    "crates/quanta-index-semantic",
    "crates/quanta-index-ipc",
    "crates/quanta-index-search-plane",
    "crates/quanta-index-searchd",
    "crates/quanta-index-searchd-runtime",
    "crates/quanta-index-searchctl",
    "crates/quanta-index-sdk",
    "crates/quanta-index-lq-text-norm",
    "crates/quanta-index-lq-scorer",
    "crates/quanta-index-lq-norm",
    "crates/quanta-index-lq-trigram",
    "crates/quanta-index-lq-positions",
    "crates/quanta-index-lq-regex",
    "crates/quanta-index-lq-symbol",
    "crates/quanta-index-lq-structural",
    "crates/quanta-index-lq-hybrid",
    "crates/quanta-index-lq-bridge",
    "crates/quanta-index-lq-obs",
    "crates/quanta-index-corpus-smoke",
]
resolver = "2"


[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.lints.rust]
warnings = { level = "deny", priority = -3 }
future_incompatible = { level = "deny", priority = -2 }
nonstandard_style = { level = "deny", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -2 }
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_results = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
let_underscore_lock = "deny"

# Intentionally not enabled yet:
# missing_docs = "deny"
# Current public surface is still largely undocumented, so turning this on now
# would create large mechanical churn instead of a focused safety gate.

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
cargo = { level = "deny", priority = -2 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -2 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
assertions_on_constants = "allow"
dbg_macro = "deny"
derive_partial_eq_without_eq = "allow"
expect_used = "deny"
exit = "deny"
indexing_slicing = "deny"
integer_division = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
match_wild_err_arm = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unimplemented = "deny"
unreachable = "deny"
unused_self = "allow"
unwrap_used = "deny"
use_self = "allow"
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
ciborium = "0.2.2"
crc32fast = "1.4.2"
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
fs2 = "0.4.3"
lance = { version = "6.0.1", default-features = false }
memchr = "2.8"
memmap2 = "0.9.5"
proptest = "1.6.0"
regex = "=1.10.6"
regex-syntax = "=0.8.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.22"
tempfile = "3.16.0"
thiserror = "1.0.69"
toml = "0.8"
tokio = { version = "1.42", default-features = false, features = ["fs", "rt", "net", "io-util", "macros", "signal", "sync", "time"] }
unicode-normalization = "0.1"

[profile.dev]
# Keep backtraces useful while avoiding full DWARF rebuild churn on every edit.
debug = 1
incremental = true

[profile.dev.package."*"]
# Dependency debug info is expensive and rarely needed during normal local loops.
debug = false

[profile.test]
# Test compiles use the same local iteration path as `cargo check`, so keep
# them incremental and avoid full debug info for every dependency rebuild.
debug = 1
incremental = true

[profile.test.package."*"]
debug = false

[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"
