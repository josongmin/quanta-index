[workspace]
members = [
    "crates/quanta-index-contract",
    "crates/quanta-index-contract-base",
    "crates/quanta-index-core",
    "crates/quanta-index-embed",
    "crates/quanta-index-lexical",
    "crates/quanta-index-repomap",
    "crates/quanta-index-semantic",
    "crates/quanta-index-ipc",
    "crates/quanta-index-search-plane",
    "crates/quanta-index-searchd",
    "crates/quanta-index-searchd-runtime",
    "crates/quanta-index-searchd-harness",
    "crates/quanta-index-scan-experiment",
    "crates/quanta-index-searchctl",
    "crates/quanta-index-sdk",
    "crates/quanta-index-lq-norm",
    "crates/quanta-index-lq-text-normalizer",
    "crates/quanta-index-lq-trigram",
    "crates/quanta-index-lq-positions",
    "crates/quanta-index-lq-regex",
    "crates/quanta-index-lq-structural",
    "crates/quanta-index-lq-bridge",
    "crates/quanta-index-lq-obs",
    "crates/quanta-index-corpus-smoke",
    "crates/quanta-index-catalog",
    "benchmarks/retrieval",
    "benchmarks/bench-protocol",
]
exclude = ["vendor/tree-sitter-typescript"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.lints.rust]
warnings = { level = "deny", priority = -3 }
future_incompatible = { level = "deny", priority = -2 }
nonstandard_style = { level = "deny", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -2 }
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_results = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
let_underscore_lock = "deny"

# Intentionally not enabled yet:
# missing_docs = "deny"
# Current public surface is still largely undocumented, so turning this on now
# would create large mechanical churn instead of a focused safety gate.

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
cargo = { level = "deny", priority = -2 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -2 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
assertions_on_constants = "allow"
dbg_macro = "deny"
derive_partial_eq_without_eq = "allow"
expect_used = "deny"
exit = "deny"
indexing_slicing = "deny"
integer_division = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
match_wild_err_arm = "deny"
# lancedb's transitive subtree carries multiple versions of bitflags / hashbrown /
# syn / thiserror etc.; supply-chain policy is enforced in deny.toml via the
# `lancedb@0.30` skip-tree (LDB-00 §3.2). `clippy::multiple_crate_versions` reads
# Cargo.lock directly and would otherwise re-flag the same allowlisted state.
# Do not add a crate-local `expect` for this lint: it overrides this allowance
# and triggers repeated full dependency-graph traversals even when the
# duplicates are permitted. `cargo-deny` remains the dependency-policy gate.
multiple_crate_versions = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `clippy::redundant_pub_crate` (nursery) directly conflicts with the workspace
# rustc `unreachable_pub = "deny"` policy. This codebase's convention is
# `pub(crate)` items inside private modules: `unreachable_pub` requires exactly
# that form (a bare `pub` item unreachable outside the crate is denied), while
# `redundant_pub_crate` demands the opposite (`pub` instead of `pub(crate)`).
# The two cannot both be satisfied, so the nursery lint yields to the
# established `pub(crate)` + `unreachable_pub` convention.
redundant_pub_crate = "allow"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unimplemented = "deny"
unreachable = "deny"
unused_self = "allow"
unwrap_used = "deny"
use_self = "allow"
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
# arrow-array / arrow-schema pinned to the major version lancedb 0.30 uses
# internally; mismatched majors silently fail downcast_ref::<StringArray>() etc.
# at runtime. Bump in lockstep with lancedb on upgrade.
arrow-array = "58"
arrow-schema = "58"
ciborium = "0.2.2"
crc32fast = "1.4.2"
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
fs2 = "0.4.3"
# Persistent (structurally shared) ordered maps for the auxiliary authority
# snapshots: a retained epoch shares every unchanged node with the current
# one, so retaining `AUX_EPOCH_RETAIN` snapshots costs the changed paths,
# not `AUX_EPOCH_RETAIN` copies of the generation (QI-BB-020 W2).
imbl = { version = "7.0.2", default-features = false, features = ["serde"] }
rustix = { version = "1.1.4", features = ["fs"] }
futures = "0.3"
# lancedb is the semantic-adapter backend (LDB-00 §3.2). Inline pin lives here,
# in lockstep with deny.toml's `lancedb@0.30` skip-tree entry.
lancedb = { version = "0.30", default-features = false }
# lance is the dataset engine under lancedb 0.30 (same locked crate, no new
# code): the semantic adapter reads per-segment index build parameters from
# its statistics, which lancedb does not surface (QI-BB-027).
lance = { version = "=7.0.0", default-features = false }
memchr = "2.8"
memmap2 = "0.9.5"
model2vec-rs = { version = "=0.3.0", default-features = false, features = ["wasm"] }
# Safe `getpeereid(3)` wrapper for the socket peer-credential check on the
# BSDs (macOS included); Linux uses rustix's `SO_PEERCRED`. Only `socket` +
# `user` are enabled — the two features `nix::unistd::getpeereid` sits behind.
signal-hook = "0.3"
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }
proptest = "1.6.0"
regex = "1"
regex-syntax = "0.8"
# Blocking HTTP for the OpenAI embedding provider. rustls (no openssl, per
# deny.toml bans) + webpki roots; reuses the reqwest 0.12 / rustls 0.23 already
# in-tree via lancedb, so no new TLS stack or duplicate version is introduced.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Compressed doc-id bitmaps for the lexical adapter's derived restriction
# sets (QI-BB-024); the same locked crate the lance dataset engine already
# builds, so no new code enters the graph.
roaring = "0.11.4"
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }
sha2 = "0.10"
tantivy = "0.22"
tantivy-fst = "=0.5.0"
tempfile = "3.16.0"
thiserror = "1.0.69"
toml = "0.8"
tokio = { version = "1.42", default-features = false, features = ["fs", "rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
# Bounded compression for IPC request bodies that exceed the wire-frame cap;
# zstd is already in the locked graph through Lance and Arrow.
zstd = { version = "0.13.3", default-features = false }
# Benchmark-only parsing for the retrieval brace-heuristic chunker (RB-03)
# and the RBR-04 source-bound symbol producer: tree-sitter boundaries
# replace the retired hand lexer. No product crate may depend on these.
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = { version = "=0.23.2", path = "vendor/tree-sitter-typescript" }
unicode-normalization = "0.1"

[profile.dev]
# Keep backtraces useful while avoiding full DWARF rebuild churn on every edit.
debug = 1
incremental = true

[profile.dev.package."*"]
# Dependency debug info is expensive and rarely needed during normal local loops.
debug = false

[profile.test]
# Test compiles use the same local iteration path as `cargo check`, so keep
# them incremental and avoid full debug info for every dependency rebuild.
debug = 1
incremental = true

[profile.test.package."*"]
debug = false

[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
# Bench lanes compare against their own baselines; disabling LTO and restoring
# some codegen parallelism keeps the warm-matrix gate runnable without changing
# the command surface.
lto = false
codegen-units = 16
