name: correctness

# Heavy correctness tooling (Miri / sanitizers / mutation testing / unused-dep
# scans). These run nightly on a schedule, on pull requests, and on demand via
# workflow_dispatch. They are intentionally separate from `ci.yml` because they
# take significantly longer than the regular test rail.

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      proof_bundle_run_id:
        description: "Run ID containing the exact-source proof-authority-release-bundle artifact"
        required: false
        type: string
      paired_repository_ref:
        description: "Exact 40-character semantica-codegraph-v2 commit for the proof source pair"
        required: false
        type: string

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-authority-release-gate:
    name: proof-authority-release-gate (all registered proofs)
    if: github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an unpinned paired repository
        shell: bash
        env:
          PAIRED_REPOSITORY_REF: ${{ inputs.paired_repository_ref }}
        run: |
          if [[ ! "$PAIRED_REPOSITORY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "paired_repository_ref must be an exact 40-character commit" >&2
            exit 2
          fi

      - name: Checkout the paired Semantica source
        uses: actions/checkout@v4
        with:
          repository: josongmin/semantica-codegraph-v2
          ref: ${{ inputs.paired_repository_ref }}
          fetch-depth: 0
          path: .proof-pairs/semantica-codegraph-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof-authority dependencies
        run: python -m pip install -e .

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Restore the exact-source release proof bundle
        uses: actions/download-artifact@v4
        with:
          name: proof-authority-release-bundle
          path: artifacts/proof-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.proof_bundle_run_id }}

      - name: Validate every registered proof and the P12 aggregate receipt
        env:
          SEMANTICA_CHECKOUT: ${{ github.workspace }}/.proof-pairs/semantica-codegraph-v2
        run: just proof-authority-release-gate

  rust-authority-nextest:
    name: rust-authority-nextest (nightly receipt)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rust nextest authority receipt
        run: |
          mkdir -p artifacts/test-authority
          set -o pipefail
          export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1
          ./scripts/cargow nextest run --workspace --all-features --locked \
            --message-format libtest-json-plus --message-format-version 0.1 \
            | tee artifacts/test-authority/nextest.jsonl
          python3 tools/ci/write-verification-receipt.py \
            --rail nightly-workspace-nextest \
            --tier nightly \
            --command "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1" \
            --evidence artifacts/test-authority/nextest.jsonl \
            --out artifacts/test-authority/receipt.json

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: test-authority-${{ github.run_id }}-${{ github.job }}
          path: artifacts/test-authority/
          if-no-files-found: error

  rust-miri:
    name: rust-miri (UB detection)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: ~/.cache/quanta-index/target
          key: miri-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            miri-target-${{ runner.os }}-

      - name: cargo miri setup
        run: cargo miri setup

      # Miri cannot execute FFI (rusqlite/sqlite3), so we only run miri on
      # crates that have no FFI dependencies in their library tests.
      - name: cargo miri test (contract + core)
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: |
          source scripts/quanta-index-env.sh
          cargo miri test \
            -p quanta-index-contract \
            -p quanta-index-core \
            --lib \
            --all-features

  rust-careful:
    name: rust-careful (stacked borrows / debug assertions)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-careful
        uses: taiki-e/install-action@cargo-careful

      - name: cargo careful test (full workspace)
        run: |
          source scripts/quanta-index-env.sh
          cargo careful test --workspace --all-features --locked

  rust-tsan:
    name: rust-tsan (ThreadSanitizer)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu

      - name: cargo test (TSan)
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
        run: |
          source scripts/quanta-index-env.sh
          cargo test \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            --workspace \
            --all-features \
            --lib --tests

  rust-asan:
    name: rust-asan (AddressSanitizer)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu

      - name: cargo test (ASan)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: |
          source scripts/quanta-index-env.sh
          cargo test \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            --workspace \
            --all-features \
            --lib --tests

  rust-mutants:
    name: rust-mutants (mutation testing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      # Mutate only the core crate (vendor-neutral logic) — that's where
      # policy correctness lives and where test-suite signal is highest value.
      - name: cargo mutants -p quanta-index-core
        run: |
          source scripts/quanta-index-env.sh
          cargo mutants \
            --package quanta-index-core \
            --timeout 60 \
            --baseline=skip \
            --no-shuffle

  rust-udeps:
    name: rust-udeps (unused deps, rustc)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: cargo udeps
        run: |
          source scripts/quanta-index-env.sh
          CARGO_INCREMENTAL=0 cargo udeps --workspace --all-targets --all-features

  rust-llvm-lines:
    name: rust-llvm-lines (monomorphization budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-llvm-lines
        uses: taiki-e/install-action@cargo-llvm-lines

      - name: Check LLVM lines against baseline
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-llvm-lines.py

  rust-full-corpus:
    name: rust-full-corpus (real-engine corpus)
    # PR workspace nextest already runs this module; retain the isolated
    # diagnostic rail for nightly and explicit runs without a second PR build.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run full-corpus module from runtime_risk_suite
        run: |
          ./scripts/cargow nextest run \
            -p quanta-index-searchd-runtime \
            --test runtime_risk_suite \
            --all-features \
            --locked \
            -E 'test(/^e2e_full_corpus::/)' \
            --no-tests fail \
            --success-output final

  rust-public-api:
    name: rust-public-api (contract surface diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (cargo-public-api requires it)
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-public-api
        uses: taiki-e/install-action@cargo-public-api

      - name: Diff public API of quanta-index-contract
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-public-api.py

  rust-cargo-modules:
    name: rust-cargo-modules (module-tree snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-modules
        uses: taiki-e/install-action@cargo-modules

      - name: Diff module tree of guarded crates
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-cargo-modules-snapshot.py

  rust-fuzz-smoke:
    name: rust-fuzz-smoke (IPC decoders, 60s each)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Build fuzz targets (contract)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz build

      - name: Smoke-run ipc_request_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run ipc_request_decode -- -max_total_time=60

      - name: Smoke-run ipc_response_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run ipc_response_decode -- -max_total_time=60

      - name: Smoke-run search_corpus_ingest_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run search_corpus_ingest_decode -- -dict=dictionaries/search_corpus_ingest.dict -max_total_time=60

      - name: Build fuzz targets (lq-norm)
        run: cd crates/quanta-index-lq-norm/fuzz && cargo +nightly fuzz build

      - name: Smoke-run lq_parse_pipeline (60s)
        run: cd crates/quanta-index-lq-norm/fuzz && cargo +nightly fuzz run lq_parse_pipeline -- -max_total_time=60

  rust-changed-line-coverage:
    name: rust-changed-line-coverage (90 percent production Rust)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage contract test dependency
        run: python -m pip install 'pytest>=8.3.0'

      - name: Check changed-line coverage gate contracts
        run: python3 -m pytest tools/ci/tests/test_check_changed_line_coverage.py -q

      - name: Produce workspace LCOV with nextest
        run: |
          source scripts/quanta-index-env.sh
          cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path /tmp/quanta-index-coverage.lcov

      - name: Fail closed on uncovered changed production Rust lines
        run: |
          python3 tools/ci/lint/check-changed-line-coverage.py \
            --lcov /tmp/quanta-index-coverage.lcov \
            --base "${{ github.event.pull_request.base.sha }}" \
            --minimum-percent 90

  dsl-bench-latency:
    name: dsl-bench-latency (Layer-3 regression gate, report-only)
    # RFC-DSL-Benchmarking Phase B. Latency baselines are machine-specific
    # (the RFC mandates "same machine"), so the committed baselines under
    # tools/benchmark/baselines/ are dev-captured references. This job runs on
    # schedule / manual dispatch only — never on pull_request — and is wired
    # report-only via `continue-on-error`. To promote it to a hard blocking
    # gate: recapture the baselines ON this runner (a workflow_dispatch run +
    # `compare_dsl_bench.py --update-baseline`, commit the result), then drop
    # the `continue-on-error` line below.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Warm matrix (criterion + p50/p95/p99 artifact)
        run: |
          mkdir -p artifacts/dsl-bench
          DSL_BENCH_WARM_SAMPLES=50 \
          DSL_BENCH_WARM_OUT="$PWD/artifacts/dsl-bench/warm-matrix.json" \
          ./scripts/cargow bench -p quanta-index-searchd-runtime --bench dsl_query_matrix --all-features --locked

      - name: Fresh artifacts are attributed to this HEAD
        run: python3 tools/ci/lint/check-bench-artifacts.py --skip-baselines

      - name: Cold matrix (fresh-process-per-sample)
        run: python3 tools/benchmark/run_dsl_cold_matrix.py --samples 10 --out artifacts/dsl-bench/cold-matrix.json

      - name: Compare warm vs baseline
        run: python3 tools/benchmark/compare_dsl_bench.py tools/benchmark/baselines/warm-matrix.json artifacts/dsl-bench/warm-matrix.json

      - name: Compare cold vs baseline
        run: python3 tools/benchmark/compare_dsl_bench.py tools/benchmark/baselines/cold-matrix.json artifacts/dsl-bench/cold-matrix.json
