name: correctness

# Heavy correctness tooling. PRs retain source-specific structural gates and
# changed-line coverage; exhaustive interpreter, sanitizer, mutation, unused-
# dependency and fuzz exploration runs nightly or on explicit dispatch. These
# are intentionally separate from `ci.yml` because they take significantly
# longer than the regular test rail. A proof bundle dispatch selects code
# qualification or final production qualification; ordinary PRs run neither.

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      proof_bundle_run_id:
        description: "Run ID containing the exact-source proof-authority-release-bundle artifact"
        required: false
        type: string
      proof_stage:
        description: "Code qualification before deployment, or final production qualification"
        required: false
        type: choice
        options:
          - final
          - code
        default: final
      paired_repository_ref:
        description: "Exact 40-character semantica-codegraph-v2 commit for the proof source pair"
        required: false
        type: string

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-authority-bundle-gate:
    name: proof-authority-bundle-gate (${{ inputs.proof_stage }})
    if: github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an unpinned paired repository
        shell: bash
        env:
          PAIRED_REPOSITORY_REF: ${{ inputs.paired_repository_ref }}
        run: |
          if [[ ! "$PAIRED_REPOSITORY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "paired_repository_ref must be an exact 40-character commit" >&2
            exit 2
          fi

      - name: Checkout the paired Semantica source
        uses: actions/checkout@v4
        with:
          repository: josongmin/semantica-codegraph-v2
          ref: ${{ inputs.paired_repository_ref }}
          fetch-depth: 0
          path: .proof-pairs/semantica-codegraph-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof-authority dependencies
        run: python -m pip install 'jsonschema>=4.23.0'

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Restore the exact-source release proof bundle
        uses: actions/download-artifact@v4
        with:
          name: proof-authority-release-bundle
          path: artifacts/proof-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.proof_bundle_run_id }}

      - name: Validate the selected qualification stage
        env:
          SEMANTICA_CHECKOUT: ${{ github.workspace }}/.proof-pairs/semantica-codegraph-v2
          PROOF_STAGE: ${{ inputs.proof_stage }}
        shell: bash
        run: |
          case "$PROOF_STAGE" in
            code) just proof-authority-code-gate ;;
            final) just proof-authority-release-gate ;;
            *) echo "unsupported proof stage: $PROOF_STAGE" >&2; exit 2 ;;
          esac

  rust-authority-nextest:
    name: rust-authority-nextest (nightly receipt)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rust nextest authority receipt
        run: |
          mkdir -p artifacts/test-authority
          set -o pipefail
          export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1
          ./scripts/cargow nextest list --workspace --all-features --locked \
            --message-format json > artifacts/test-authority/inventory.json
          ./scripts/cargow nextest run --workspace --all-features --locked \
            --message-format libtest-json-plus --message-format-version 0.1 \
            | tee artifacts/test-authority/nextest.jsonl
          python3 tools/ci/write-verification-receipt.py \
            --rail nightly-workspace-nextest \
            --tier nightly \
            --command "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1" \
            --evidence artifacts/test-authority/nextest.jsonl \
            --inventory artifacts/test-authority/inventory.json \
            --out artifacts/test-authority/receipt.json

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: test-authority-${{ github.run_id }}-${{ github.job }}
          path: artifacts/test-authority/
          if-no-files-found: error

  rust-miri:
    name: rust-miri (UB detection)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: ~/.cache/quanta-index/target
          key: miri-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            miri-target-${{ runner.os }}-

      - name: cargo miri setup
        run: cargo miri setup

      # Miri cannot execute FFI (rusqlite/sqlite3), so we only run miri on
      # crates that have no FFI dependencies in their library tests.
      - name: cargo miri test (contract + core)
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: |
          source scripts/quanta-index-env.sh
          cargo miri test \
            -p quanta-index-contract \
            -p quanta-index-core \
            --lib \
            --all-features

  rust-careful:
    name: rust-careful (stacked borrows / debug assertions)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-careful
        uses: taiki-e/install-action@cargo-careful

      - name: cargo careful test (full workspace)
        run: |
          source scripts/quanta-index-env.sh
          cargo careful test --workspace --all-features --locked

  rust-tsan:
    name: rust-tsan (ThreadSanitizer)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu

      - name: cargo test (TSan)
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
        run: |
          source scripts/quanta-index-env.sh
          ./scripts/cargow test \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            --workspace \
            --all-features \
            --lib --tests

  rust-asan:
    name: rust-asan (AddressSanitizer)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu

      - name: cargo test (ASan)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: |
          source scripts/quanta-index-env.sh
          ./scripts/cargow test \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            --workspace \
            --all-features \
            --lib --tests

  rust-mutants:
    name: rust-mutants (mutation testing)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      # Mutate only the core crate (vendor-neutral logic) — that's where
      # policy correctness lives and where test-suite signal is highest value.
      - name: cargo mutants -p quanta-index-core
        run: |
          source scripts/quanta-index-env.sh
          cargo mutants \
            --package quanta-index-core \
            --timeout 60 \
            --baseline=skip \
            --no-shuffle

  rust-udeps:
    name: rust-udeps (unused deps, rustc)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: cargo udeps
        run: |
          source scripts/quanta-index-env.sh
          CARGO_INCREMENTAL=0 cargo udeps --workspace --all-targets --all-features

  rust-llvm-lines:
    name: rust-llvm-lines (monomorphization budget)
    if: github.event_name != 'workflow_dispatch' || inputs.proof_bundle_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-llvm-lines
        uses: taiki-e/install-action@cargo-llvm-lines

      - name: Check LLVM lines against baseline
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-llvm-lines.py

  rust-public-api:
    name: rust-public-api (contract surface diff)
    if: github.event_name != 'workflow_dispatch' || inputs.proof_bundle_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly for public API snapshots
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.51.0

      - name: Diff public API of quanta-index-contract
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-public-api.py

  rust-cargo-modules:
    name: rust-cargo-modules (module-tree snapshot)
    if: github.event_name != 'workflow_dispatch' || inputs.proof_bundle_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-modules
        uses: taiki-e/install-action@cargo-modules

      - name: Diff module tree of guarded crates
        run: |
          source scripts/quanta-index-env.sh
          python3 tools/ci/lint/check-cargo-modules-snapshot.py

  rust-fuzz-smoke:
    name: rust-fuzz-smoke (IPC decoders, 60s each)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Drop rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Build fuzz targets (contract)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz build

      - name: Smoke-run ipc_request_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run ipc_request_decode -- -max_total_time=60

      - name: Smoke-run ipc_response_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run ipc_response_decode -- -max_total_time=60

      - name: Smoke-run search_corpus_ingest_decode (60s)
        run: cd crates/quanta-index-contract/fuzz && cargo +nightly fuzz run search_corpus_ingest_decode -- -dict=dictionaries/search_corpus_ingest.dict -max_total_time=60

      - name: Build fuzz targets (lq-norm)
        run: cd crates/quanta-index-lq-norm/fuzz && cargo +nightly fuzz build

      - name: Smoke-run lq_parse_pipeline (60s)
        run: cd crates/quanta-index-lq-norm/fuzz && cargo +nightly fuzz run lq_parse_pipeline -- -max_total_time=60

  rust-changed-line-coverage:
    name: rust-changed-line-coverage (90 percent production Rust)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage contract test dependency
        run: python -m pip install 'pytest>=8.3.0'

      - name: Check changed-line coverage gate contracts
        run: python3 -m pytest tools/ci/tests/test_check_changed_line_coverage.py -q

      - name: Produce workspace LCOV with nextest
        run: |
          ./scripts/cargow --lane coverage-lane llvm-cov nextest --workspace --all-features --locked --lcov --output-path /tmp/quanta-index-coverage.lcov

      - name: Fail closed on uncovered changed production Rust lines
        run: |
          python3 tools/ci/lint/check-changed-line-coverage.py \
            --lcov /tmp/quanta-index-coverage.lcov \
            --base "${{ github.event.pull_request.base.sha }}" \
            --minimum-percent 90

  dsl-bench-latency:
    name: dsl-bench-latency (Layer-3 authority gate)
    # This gate deliberately fails until committed baselines are captured on
    # this dedicated host. Report-only latency output is not a regression gate.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.proof_bundle_run_id == '')
    runs-on: [self-hosted, linux, quanta-bench]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Benchmark control-plane policy (registry, dependency direction, no direct bypass)
        run: python3 tools/ci/lint/check-benchmark-policy.py

      # The DSL and systems families are driven only through the single registry
      # CLI: source freeze, host preflight, producer order, artifact validation,
      # immutable BenchmarkEvidenceV1 promotion and the declared comparators all
      # happen inside `benchctl run`. A direct `just <producer>` or
      # `compare_dsl_bench.py` step here would be a bypass and fails policy.
      - name: DSL authority profile through the registry CLI
        run: |
          python3 tools/benchmark/benchctl.py run dsl-authority \
            --cold-samples 20 \
            --evidence-root "$RUNNER_TEMP/quanta-bench-evidence"

      - name: Systems profile through the registry CLI
        run: |
          python3 tools/benchmark/benchctl.py run systems \
            --evidence-root "$RUNNER_TEMP/quanta-bench-evidence"

      - name: Require the promoted runs in a fresh process
        run: |
          python3 tools/benchmark/benchctl.py validate dsl-authority \
            --evidence-root "$RUNNER_TEMP/quanta-bench-evidence"
          python3 tools/benchmark/benchctl.py validate systems \
            --evidence-root "$RUNNER_TEMP/quanta-bench-evidence"

      - name: Replay the DSL warm run from its captured raw evidence
        run: |
          python3 tools/benchmark/benchctl.py replay --family dsl-warm \
            --evidence-root "$RUNNER_TEMP/quanta-bench-evidence"

      - name: Upload DSL benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsl-bench-${{ github.run_id }}-${{ github.job }}
          path: artifacts/dsl-bench/
          if-no-files-found: error

      - name: Upload systems benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systems-bench-${{ github.run_id }}-${{ github.job }}
          path: |
            artifacts/search-quality/freshness/latest/
            artifacts/search-quality/open-loop/latest/
          if-no-files-found: error

      - name: Upload immutable benchmark runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-runs-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/quanta-bench-evidence/
          if-no-files-found: error
