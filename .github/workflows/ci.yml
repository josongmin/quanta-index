name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pre-commit
        run: bash -lc 'source scripts/quanta-index-env.sh && python -m pre_commit run --all-files --show-diff-on-failure'

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: rust fmt
        run: ./scripts/cargow fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy

      - name: rust check
        run: ./scripts/cargow check --workspace --all-targets --all-features --locked

      - name: rust clippy
        run: ./scripts/cargow clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rust nextest
        run: ./scripts/cargow nextest run --workspace --all-features --locked

  rust-msrv:
    name: rust-msrv (1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove rust-toolchain override
        run: rm -f rust-toolchain.toml

      - name: Install MSRV toolchain (exact)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: cargo +1.92.0 check
        run: cargo +1.92.0 check --workspace --all-targets --all-features --locked

      - name: cargo +1.92.0 test --no-run
        run: cargo +1.92.0 test --workspace --all-features --locked --no-run

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: rust doc
        run: bash -lc 'RUSTDOCFLAGS="-D warnings" ./scripts/cargow doc --workspace --all-features --no-deps --locked'

  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny
        run: bash scripts/run-cargo-deny.sh

  rust-machete:
    name: rust-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: cargo machete
        run: cargo machete --with-metadata

  rust-bench-build:
    name: rust-bench-build (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: cargo bench --no-run
        run: ./scripts/cargow bench --workspace --all-features --locked --no-run

  rust-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Ensure all workspace crates inherit lints
        run: python3 scripts/check_workspace_lints.py

      - name: Ban #[allow]
        run: bash scripts/check-rust-allow-attributes.sh

      - name: Hexagonal domain boundaries
        run: python3 tools/ci/lint/lint-hexagonal-boundaries.py

      - name: Rust derive allowlist
        run: python3 tools/ci/lint/check-rust-derive-allowlist.py

      - name: Cargo.toml hygiene
        run: python3 tools/ci/lint/check-cargo-toml-hygiene.py

      - name: Module discipline (mod.rs / contract lib.rs facade-only)
        run: python3 tools/ci/lint/check-module-discipline.py

      - name: Error shape (pub *Error must implement std::error::Error)
        run: python3 tools/ci/lint/check-error-shape.py

  agent-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Identify changed agent output JSONs
        id: changed
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- '**/agent_output*.json' 'agent_output*.json' 2>/dev/null || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate agent outputs (semantic gate)
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            python3 tools/ci/agent/validate_agent_output.py "$f" --skip-rust-gates
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run semgrep
        run: bash scripts/run-semgrep.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: actionlint
        run: bash scripts/run-actionlint.sh

      - name: shellcheck
        run: bash scripts/run-shellcheck.sh

  prompt-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prompt-manager deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: prompt-manager sync
        run: python tools/prompt-manager/pm.py sync

      - name: prompt-manager lint
        run: python tools/prompt-manager/pm.py lint

      - name: prompt-manager ruff
        run: bash -lc 'source scripts/quanta-index-env.sh && python -m ruff check . && python -m ruff format --check .'

      - name: tooling tests
        run: bash -lc 'source scripts/quanta-index-env.sh && python -m pytest tools -q -o cache_dir="$PYTEST_CACHE_DIR"'

      - name: generated files clean
        run: git diff --exit-code
