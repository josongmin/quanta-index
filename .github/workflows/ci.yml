name: ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install 'pre-commit>=4.0.0'

      - name: Run pre-commit
        env:
          # Dedicated jobs below own these whole-revision checks. Keep this
          # job for action/shell policy, generic file integrity, and hygiene.
          SKIP: ruff,ruff-format,prompt-manager-lint,cargo-fmt-check,cargo-check,hexagonal-boundaries,rust-derive-allowlist,rust-cargo-toml-hygiene,proof-authority,rust-digest-fallibility
        run: bash -lc 'source scripts/quanta-index-env.sh && python -m pre_commit run --all-files --show-diff-on-failure'

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: rust fmt
        run: ./scripts/cargow fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy

      - name: rust clippy
        run: ./scripts/cargow clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rust nextest
        run: |
          mkdir -p artifacts/test-authority
          set -o pipefail
          export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1
          ./scripts/cargow nextest list --workspace --all-features --locked \
            --message-format json > artifacts/test-authority/inventory.json
          ./scripts/cargow nextest run --workspace --all-features --locked \
            --message-format libtest-json-plus --message-format-version 0.1 \
            | tee artifacts/test-authority/nextest.jsonl

      - name: Write PR or merge verification receipt
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            tier="merge"
            rail="merge-workspace-nextest"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            tier="pr"
            rail="pr-workspace-nextest"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tier="main"
            rail="main-workspace-nextest"
          else
            echo "No verification receipt is defined for ${{ github.event_name }} on ${{ github.ref }}" >&2
            exit 2
          fi
          python3 tools/ci/write-verification-receipt.py \
            --rail "$rail" \
            --tier "$tier" \
            --command "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1" \
            --evidence artifacts/test-authority/nextest.jsonl \
            --inventory artifacts/test-authority/inventory.json \
            --out artifacts/test-authority/receipt.json

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: test-authority-${{ github.run_id }}-${{ github.job }}
          path: artifacts/test-authority/
          if-no-files-found: error

  rust-msrv:
    name: rust-msrv (1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install MSRV toolchain (exact)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: cargo +1.92.0 test --all-targets --no-run
        run: RUSTUP_TOOLCHAIN=1.92.0 ./scripts/cargow --lane msrv-lane test --workspace --all-targets --all-features --locked --no-run

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: rust doc
        run: bash -lc 'RUSTDOCFLAGS="-D warnings" ./scripts/cargow doc --workspace --all-features --no-deps --locked'

  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny
        run: bash scripts/run-cargo-deny.sh

  rust-machete:
    name: rust-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: cargo machete
        run: cargo machete --with-metadata

  rust-bench-build:
    name: rust-bench-build (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: cargo bench --no-run
        run: ./scripts/cargow bench --workspace --all-features --locked --no-run

  rust-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install policy dependencies
        run: python -m pip install 'jsonschema>=4.23.0' 'pyyaml>=6.0.2' 'tree-sitter-language-pack==0.9.1'

      - name: Ensure all workspace crates inherit lints
        run: python3 scripts/check_workspace_lints.py

      - name: Ban #[allow]
        run: bash scripts/check-rust-allow-attributes.sh

      - name: Hexagonal domain boundaries
        run: python3 tools/ci/lint/lint-hexagonal-boundaries.py

      - name: Rust derive allowlist
        run: python3 tools/ci/lint/check-rust-derive-allowlist.py

      - name: Cargo.toml hygiene
        run: python3 tools/ci/lint/check-cargo-toml-hygiene.py

      - name: Module discipline (mod.rs / contract lib.rs facade-only)
        run: python3 tools/ci/lint/check-module-discipline.py

      - name: Module cycles (every crate's module graph points one way)
        run: python3 tools/ci/lint/check-module-cycles.py

      - name: Error shape (pub *Error must implement std::error::Error)
        run: python3 tools/ci/lint/check-error-shape.py

      - name: Wire-surface inventory (IPC opcodes + on-disk format versions)
        run: python3 tools/ci/lint/check-wire-inventory.py

      - name: Benchmark artifacts are attributed to HEAD (no stale / unknown-SHA / old-schema artifact)
        run: python3 tools/ci/lint/check-bench-artifacts.py

      - name: Benchmark control-plane policy (registry, dependency direction, no direct bypass)
        run: python3 tools/ci/lint/check-benchmark-policy.py

      - name: Install benchmark contract tooling
        uses: astral-sh/setup-uv@v6

      - name: Install just for benchmark contracts
        uses: taiki-e/install-action@just

      - name: Benchmark capture and custody contracts
        run: uv run --frozen --extra dev just benchmark-control-contract-local

      - name: Digest fallibility (pub fn -> [u8; N] must be Result or doc'd infallible)
        run: python3 tools/ci/lint/check-digest-fallibility.py

      - name: Semantic outcome honesty (registered Rust enums)
        run: python3 tools/ci/lint/check-semantic-outcomes.py

      - name: Rust syntax and search-plane authority counterexamples
        run: |
          python3 tools/ci/tests/test_check_rust_fallbacks.py
          python3 tools/ci/lint/check-rust-fallbacks.py

      - name: Test authority (every integration and fuzz target has an owner rail)
        run: python3 tools/ci/lint/check-test-authority.py

      - name: DSL capability truth from executable owners
        run: python3 tools/ci/lint/check-dsl-capability-truth.py

      - name: Ignored-test exceptions are owned and unexpired
        run: python3 tools/ci/lint/check-ignored-test-policy.py

      - name: Sourcegraph parity coverage and generated doc
        run: |
          python3 tools/benchmark/sourcegraph_parity.py --check --write
          git diff --exit-code tools/benchmark/SOURCEGRAPH_PARITY.md

  proof-authority-current-gate:
    name: proof-authority-current-gate (P00)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch private Cargo dependencies
        uses: ./.github/actions/private-cargo-dependencies
        with:
          sstable-ssh-key: ${{ secrets.QUANTA_TANTIVY_SSTABLE_READ_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof-authority dependencies
        run: python -m pip install 'jsonschema>=4.23.0' 'pytest>=8.3.0'

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Produce P00 authority proof from the static gate
        shell: bash
        run: |
          mkdir -p artifacts/proof-authority/raw
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set -euo pipefail
          just proof-p00-authority-freeze \
            | tee artifacts/proof-authority/raw/p00-authority.log
          ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$started_at" "$ended_at" <<'PY'
          import json
          import platform
          import sys
          from pathlib import Path

          from tools.ci.proof_host import github_host_environment

          terminal = {
              "status": "passed",
              "counts": {
                  "selected": 1,
                  "executed": 1,
                  "passed": 1,
                  "failed": 0,
                  "ignored": 0,
              },
              "environment": {
                  "toolchain": f"python-{platform.python_version()}",
                  "features": [],
                  "os": platform.system().lower(),
                  "arch": platform.machine(),
                  "host": github_host_environment(),
              },
              "daemon_binary": None,
              "state_root_format": "not-applicable",
              "inputs": {
                  "fixture": None,
                  "corpus": None,
                  "config": None,
                  "model": None,
                  "provider": None,
              },
              "started_at": sys.argv[1],
              "ended_at": sys.argv[2],
              "artifacts": [
                  "artifacts/proof-authority/raw/p00-authority.log",
                  "artifacts/proof-authority/raw/p00-terminal-input.json",
                  "artifacts/sep-21/p00/error-authority-inventory.json",
              ],
          }
          Path("artifacts/proof-authority/raw/p00-terminal-input.json").write_text(
              json.dumps(terminal, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 tools/ci/write-proof-manifest.py \
            --proof-id p00-authority-freeze \
            --terminal-input artifacts/proof-authority/raw/p00-terminal-input.json

      - name: Validate the source-bound P00 current gate
        run: just proof-authority-current-gate

      - name: Upload P00 proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: proof-authority-p00-${{ github.run_id }}-${{ github.job }}
          path: |
            artifacts/proof-authority/
            artifacts/sep-21/p00/error-authority-inventory.json
          if-no-files-found: error

  agent-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changed agent output JSONs
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            *) echo "unsupported event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git hash-object -t tree /dev/null)"
          elif [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${base}^{commit}"; then
            echo "invalid or unavailable base commit: $base" >&2
            exit 2
          fi
          git diff --name-only -z --diff-filter=ACMRT "$base" HEAD -- \
            '**/agent_output*.json' 'agent_output*.json' \
            > "$RUNNER_TEMP/agent-output-changed-files"
          if [[ -s "$RUNNER_TEMP/agent-output-changed-files" ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changed.outputs.has_files == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent-output dependencies
        if: steps.changed.outputs.has_files == 'true'
        run: python -m pip install 'jsonschema>=4.23.0'

      - name: Validate agent outputs (semantic gate)
        if: steps.changed.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            python3 tools/ci/agent/validate_agent_output.py "$f"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/agent-output-changed-files"

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install 'semgrep==1.177.0'

      - name: Check Semgrep rule counterexamples
        run: bash scripts/check-semgrep-rules.sh

      - name: Run semgrep
        run: bash scripts/run-semgrep.sh

  prompt-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prompt-manager deps
        run: python -m pip install 'jinja2>=3.1.4' 'jsonschema>=4.23.0' 'pyyaml>=6.0.2' 'pytest>=8.3.0' 'ruff==0.16.8' 'tree-sitter-language-pack==0.9.1'

      - name: prompt-manager lint
        run: python tools/prompt-manager/pm.py lint

      - name: prompt-manager ruff
        run: bash -lc 'source scripts/quanta-index-env.sh && python -m ruff check . && python -m ruff format --check .'

      - name: tooling tests
        run: bash scripts/run-tooling-tests.sh

      - name: generated files clean
        run: git diff --exit-code
