[package]
name = "quanta-explicit-fd-process"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Exact executable-FD process launcher with explicit child descriptor mappings"

[package.metadata.layer]
tier = "tier1-adapter"

[workspace]

[dependencies]
libc = "0.2.186"
sha2 = { version = "=0.10.9", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std", "event"] }

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }
