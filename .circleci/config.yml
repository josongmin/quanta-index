version: 2.1

# Connect only default-branch pushes and PR updates in CircleCI project settings.
# The private repository uses the Free plan credit pool; expensive exploration
# requires an explicit pipeline parameter and has no schedule trigger.
# Cargo target output is deliberately not cached: scripts/cargow isolates it by
# checkout path and lane, and a broad target cache mixes clippy/test artifacts.
parameters:
  run_heavy:
    type: boolean
    default: false

jobs:
  verify:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      UV_PYTHON: "3.12.12"
      CI_EVENT_NAME: << pipeline.event.name >>
    steps:
      - checkout
      - run: &install_verification_tools
          name: Install verification tools
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler python3-venv ripgrep zsh
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain none
            fi
            . "$HOME/.cargo/env"
            rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
            curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/0.9.104/linux |
              tar zxf - -C "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh |
              bash -s -- --tag 1.58.0 --to "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -LsSf \
              https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.7/cargo-deny-0.19.7-x86_64-unknown-linux-musl.tar.gz |
              tar xzf - -C "$HOME/.cargo/bin" --strip-components=1 \
                cargo-deny-0.19.7-x86_64-unknown-linux-musl/cargo-deny
            curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.9.11/install.sh | sh
            printf 'export PATH="%s/.cargo/bin:%s/.local/bin:$PATH"\n' "$HOME" "$HOME" >> "$BASH_ENV"
            # Justfile recipes use zsh -lc, so preserve pinned tools there too.
            printf 'export PATH="%s/.cargo/bin:%s/.local/bin:$PATH"\n' "$HOME" "$HOME" >> "$HOME/.zprofile"
      - run: &verify_tool_versions
          name: Verify tool versions
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            [[ "$(rustc --version)" == rustc\ 1.92.0\ * ]]
            [[ "$(cargo nextest --version)" == cargo-nextest\ 0.9.104* ]]
            [[ "$(just --version)" == just\ 1.58.0 ]]
            [[ "$(cargo deny --version)" == cargo-deny\ 0.19.7 ]]
            [[ "$(uv --version)" == uv\ 0.9.11 ]]
            uv python install 3.12.12
            [[ "$(uv run --no-project --python 3.12.12 python --version)" == Python\ 3.12.12 ]]
            uv lock --check
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-
      - run:
          name: Fetch locked Cargo dependencies
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            ./scripts/cargow fetch --locked
            test -d "$HOME/.cargo/registry/src" || test -d "$HOME/.cargo/git/checkouts"
      - save_cache:
          key: quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-machete0.9.2-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-machete0.9.2-
      - run:
          name: Install pinned cargo-machete
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            if [[ "$(cargo machete --version 2>/dev/null || true)" != "0.9.2" ]]; then
              cargo install cargo-machete --version 0.9.2 --locked
            fi
            [[ "$(cargo machete --version)" == "0.9.2" ]]
      - save_cache:
          key: quanta-index-v2-linux-amd64-rust1.92.0-cargo-machete0.9.2-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/bin/cargo-machete
      - run:
          name: Rust format and clippy
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            ./scripts/cargow fmt --all -- --check
            ./scripts/cargow clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run:
          name: Rust dependency and MSRV checks
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            just rust-machete
            just rust-msrv
      - run:
          name: rust nextest
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            mkdir -p artifacts/test-authority
            export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1
            ./scripts/cargow nextest list --workspace --all-features --locked \
              --message-format json > artifacts/test-authority/inventory.json
            ./scripts/cargow nextest run --workspace --all-features --locked \
              --message-format libtest-json-plus --message-format-version 0.1 \
              | tee artifacts/test-authority/nextest.jsonl
            if [[ "$CI_EVENT_NAME" == pull_request ]]; then
              tier=pr
              rail=pr-workspace-nextest
            elif [[ "$CI_EVENT_NAME" == push && "${CIRCLE_BRANCH:-}" == main ]]; then
              tier=main
              rail=main-workspace-nextest
            else
              echo "No PR/main verification receipt for event=$CI_EVENT_NAME branch=${CIRCLE_BRANCH:-unknown}" >&2
              exit 2
            fi
            uv run --frozen --extra dev python tools/ci/write-verification-receipt.py \
              --rail "$rail" --tier "$tier" \
              --command "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1" \
              --evidence artifacts/test-authority/nextest.jsonl \
              --inventory artifacts/test-authority/inventory.json \
              --out artifacts/test-authority/receipt.json
      - run:
          name: Rust docs and benchmark compilation
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            just rust-doc
            just rust-bench-build
      - store_artifacts:
          path: artifacts/test-authority
          destination: test-authority

  verify-python:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      UV_PYTHON: "3.12.12"
    steps:
      - checkout
      - run: *install_verification_tools
      - run: *verify_tool_versions
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-{{ checksum "uv.lock" }}
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-modules0.26.0-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-modules0.26.0-
      - run:
          name: Install locked Python dependencies
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv sync --locked --extra dev
            test -n "$(find "$HOME/.cache/uv" -mindepth 1 -print -quit)"
            printf 'export PATH="%s/.venv/bin:$PATH"\n' "$PWD" >> "$HOME/.zprofile"
            [[ "$(zsh -lc 'python3 --version')" == Python\ 3.12.12 ]]
      - save_cache:
          key: quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Verify guarded module snapshots
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            if ! cargo modules --version 2>/dev/null | grep -Fxq 'cargo-modules 0.26.0'; then
              cargo install cargo-modules --version 0.26.0 --locked
            fi
            uv run --frozen --extra dev python tools/ci/lint/check-cargo-modules-snapshot.py
      - save_cache:
          key: quanta-index-v2-linux-amd64-rust1.92.0-cargo-modules0.26.0-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/bin/cargo-modules
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-cargo-public-api0.51.0-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-cargo-public-api0.51.0-
      - run:
          name: Install pinned public API tooling
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            rustup toolchain install nightly-2026-08-01 --profile minimal
            if [[ "$(cargo public-api --version 2>/dev/null || true)" != "cargo-public-api 0.51.0" ]]; then
              cargo install cargo-public-api --version 0.51.0 --locked
            fi
            [[ "$(cargo public-api --version)" == "cargo-public-api 0.51.0" ]]
      - save_cache:
          key: quanta-index-v2-linux-amd64-cargo-public-api0.51.0-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/bin/cargo-public-api
      - run:
          name: Verify guarded public API snapshots
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv run --frozen --extra dev python tools/ci/lint/check-public-api.py
      - run:
          name: Python policy and tooling tests
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv run --frozen --extra dev python -m pytest tools -q \
              --ignore=tools/ci/tests/test_semgrep_policy.py \
              --ignore=tools/ci/tests/test_check_rust_fallbacks.py -x -vv
            uv run --frozen --extra dev python tools/prompt-manager/pm.py lint
            uv run --frozen --extra dev python -m ruff check .
            uv run --frozen --extra dev python -m ruff format --check .
            uv run --frozen --extra dev just rust-policy
            uv run --frozen --extra dev just rust-semantic-outcomes
            uv run --frozen --extra dev just rust-fallbacks
            uv run --frozen --extra dev just benchmark-policy-local
            uv run --frozen --extra dev bash scripts/check-semgrep-rules.sh
            uv run --frozen --extra dev bash scripts/run-semgrep.sh
      - run:
          name: Validate tracked agent outputs
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            git ls-files -z -- ':(glob)**/agent_output*.json' \
              ':(exclude,glob)**/agent_output*.schema.json' |
              while IFS= read -r -d '' file; do
                uv run --frozen --extra dev python tools/ci/agent/validate_agent_output.py "$file"
              done
      - run:
          name: Produce and validate P00 authority manifest
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            mkdir -p artifacts/proof-authority/raw
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uv run --frozen --extra dev just proof-p00-authority-freeze | tee artifacts/proof-authority/raw/p00-authority.log
            ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uv run --frozen --extra dev python tools/ci/write-circleci-p00-terminal.py \
              --started-at "$started_at" --ended-at "$ended_at" \
              --out artifacts/proof-authority/raw/p00-terminal-input.json
            uv run --frozen --extra dev python tools/ci/write-proof-manifest.py \
              --proof-id p00-authority-freeze \
              --terminal-input artifacts/proof-authority/raw/p00-terminal-input.json
            uv run --frozen --extra dev just proof-authority-current-gate
      - store_artifacts:
          path: artifacts/proof-authority
          destination: proof-authority
      - store_artifacts:
          path: artifacts/sep-21/p00/error-authority-inventory.json
          destination: proof-authority/error-authority-inventory.json
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-precommit-{{ checksum ".pre-commit-config.yaml" }}-{{ checksum "uv.lock" }}
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-precommit-
      - run:
          name: Install pinned pre-commit hook environments
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv run --frozen --extra dev pre-commit install-hooks
            test -n "$(find "$HOME/.cache/pre-commit" -maxdepth 1 -type d -name 'repo*' -print -quit)"
      - save_cache:
          key: quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-precommit-{{ checksum ".pre-commit-config.yaml" }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/pre-commit
      - run:
          name: Pre-commit hooks
          no_output_timeout: 20m
          environment:
            SKIP: ruff,ruff-format,prompt-manager-lint,cargo-fmt-check,cargo-check,hexagonal-boundaries,rust-derive-allowlist,rust-cargo-toml-hygiene,proof-authority,rust-digest-fallibility
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv run --frozen --extra dev pre-commit run --all-files --show-diff-on-failure
            git diff --exit-code

  verify-pr-coverage:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      UV_PYTHON: "3.12.12"
    steps:
      - checkout
      - run: *install_verification_tools
      - run: *verify_tool_versions
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-
      - run:
          name: Fetch locked Cargo dependencies
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            ./scripts/cargow fetch --locked
            test -d "$HOME/.cargo/registry/src" || test -d "$HOME/.cargo/git/checkouts"
      - save_cache:
          key: quanta-index-v2-linux-amd64-rust1.92.0-cargo-deps-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-llvm-cov0.8.5-{{ checksum "Cargo.lock" }}
            - quanta-index-v2-linux-amd64-rust1.92.0-cargo-llvm-cov0.8.5-
      - run:
          name: Install pinned coverage tooling
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            rustup component add llvm-tools-preview --toolchain 1.92.0
            if [[ "$(cargo llvm-cov --version 2>/dev/null || true)" != "cargo-llvm-cov 0.8.5" ]]; then
              cargo install cargo-llvm-cov --version 0.8.5 --locked
            fi
            [[ "$(cargo llvm-cov --version)" == "cargo-llvm-cov 0.8.5" ]]
      - save_cache:
          key: quanta-index-v2-linux-amd64-rust1.92.0-cargo-llvm-cov0.8.5-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/bin/cargo-llvm-cov
      - restore_cache:
          keys:
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-{{ checksum "uv.lock" }}
            - quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-
      - run:
          name: Install locked coverage policy dependencies
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv sync --locked --extra dev
            test -n "$(find "$HOME/.cache/uv" -mindepth 1 -print -quit)"
      - save_cache:
          key: quanta-index-v2-linux-amd64-uv0.9.11-python3.12.12-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Changed production Rust line coverage
          no_output_timeout: 30m
          environment:
            CI_PR_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            [[ "$CI_PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$CI_PR_BASE_SHA"
            git cat-file -e "${CI_PR_BASE_SHA}^{commit}"
            uv run --frozen --extra dev python -m pytest tools/ci/tests/test_check_changed_line_coverage.py -q
            ./scripts/cargow --lane coverage-lane llvm-cov nextest \
              --workspace --all-features --locked --lcov \
              --output-path /tmp/quanta-index-coverage.lcov
            uv run --frozen --extra dev python tools/ci/lint/check-changed-line-coverage.py \
              --lcov /tmp/quanta-index-coverage.lcov \
              --base "$CI_PR_BASE_SHA" --minimum-percent 90

  heavy-correctness:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    environment:
      CARGO_BUILD_JOBS: "4"
      UV_PYTHON: "3.12.12"
    steps:
      - checkout
      - run:
          name: Install nightly fuzz tooling
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler python3-venv
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain none
            fi
            . "$HOME/.cargo/env"
            rustup toolchain install 1.92.0 --profile minimal
            rustup toolchain install nightly-2026-08-01 --profile minimal
            cargo install cargo-modules --version 0.26.0 --locked
            cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked
            curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/0.9.104/linux |
              tar zxf - -C "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.9.11/install.sh | sh
            printf 'export PATH="%s/.cargo/bin:%s/.local/bin:$PATH"\n' "$HOME" "$HOME" >> "$BASH_ENV"
      - run:
          name: Verify checked-out source
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            [[ "$(rustc --version)" == rustc\ 1.92.0\ * ]]
            [[ "$(cargo nextest --version)" == cargo-nextest\ 0.9.104* ]]
            [[ "$(cargo fuzz --version)" == cargo-fuzz\ 0.13.2* ]]
            uv python install 3.12.12
            uv lock --check
      - run:
          name: Verify guarded module snapshots
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            uv run --frozen --extra dev python tools/ci/lint/check-cargo-modules-snapshot.py
      - run:
          name: rust nextest authority receipt
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            mkdir -p artifacts/test-authority
            export NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1
            ./scripts/cargow nextest list --workspace --all-features --locked \
              --message-format json > artifacts/test-authority/inventory.json
            ./scripts/cargow nextest run --workspace --all-features --locked \
              --message-format libtest-json-plus --message-format-version 0.1 \
              | tee artifacts/test-authority/nextest.jsonl
            uv run --frozen --extra dev python tools/ci/write-verification-receipt.py \
              --rail manual-heavy-workspace-nextest --tier correctness \
              --command "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1" \
              --evidence artifacts/test-authority/nextest.jsonl \
              --inventory artifacts/test-authority/inventory.json \
              --out artifacts/test-authority/receipt.json
      - store_artifacts:
          path: artifacts/test-authority
          destination: test-authority
      - run:
          name: Validate fuzz lockfiles
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            cargo +nightly-2026-08-01 metadata --manifest-path crates/quanta-index-contract/fuzz/Cargo.toml --locked --format-version 1 > /dev/null
            cargo +nightly-2026-08-01 metadata --manifest-path crates/quanta-index-lq-norm/fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - run:
          name: Fuzz all registered decoders
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            cd crates/quanta-index-contract/fuzz
            cargo +nightly-2026-08-01 fuzz build
            cargo +nightly-2026-08-01 fuzz run ipc_request_decode -- -max_total_time=60
            cargo +nightly-2026-08-01 fuzz run ipc_response_decode -- -max_total_time=60
            cargo +nightly-2026-08-01 fuzz run search_corpus_ingest_decode -- -dict=dictionaries/search_corpus_ingest.dict -max_total_time=60
            cd ../../quanta-index-lq-norm/fuzz
            cargo +nightly-2026-08-01 fuzz build
            cargo +nightly-2026-08-01 fuzz run lq_parse_pipeline -- -max_total_time=60
      - run:
          name: Reject fuzz lockfile changes
          command: |
            set -euo pipefail
            unset BASH_ENV ENV
            git diff --exit-code -- crates/quanta-index-contract/fuzz/Cargo.lock crates/quanta-index-lq-norm/fuzz/Cargo.lock

workflows:
  regular:
    unless: << pipeline.parameters.run_heavy >>
    jobs:
      - verify
      - verify-python
      - verify-pr-coverage:
          requires:
            - verify
          filters: pipeline.event.name == "pull_request"
  manual-heavy:
    when: << pipeline.parameters.run_heavy >>
    jobs:
      - heavy-correctness
