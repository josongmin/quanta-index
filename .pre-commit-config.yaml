default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: ^(scripts/.*\.sh|tools/ci/lint/.*\.sh)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -lc 'source scripts/quanta-index-env.sh && ruff check --fix --exit-non-zero-on-fix'
        language: system
        files: ^tools/(prompt-manager|ci)/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: bash -lc 'source scripts/quanta-index-env.sh && ruff format --check'
        language: system
        files: ^tools/(prompt-manager|ci)/.*\.py$

      - id: root-hygiene
        name: root hygiene
        entry: bash tools/ci/lint/lint-root-hygiene.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: lock-freshness
        name: lock freshness
        entry: bash scripts/check-lock-freshness.sh
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|pyproject\.toml|crates/.*/Cargo\.toml|scripts/check-lock-freshness\.sh)$
        stages: [pre-commit]

      - id: doc-paths
        name: doc path lint
        entry: python3 tools/ci/lint/lint-doc-paths.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^(README\.md|AGENTS\.md|AGENT_.*\.md|CLAUDE\.md|\.codex/.*\.md|\.cursor/rules/.*\.md|tools/prompt-manager/sources/.*\.md)$
        stages: [pre-commit]

      - id: prompt-manager-lint
        name: prompt-manager lint
        entry: python3 tools/prompt-manager/pm.py lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-fmt-check
        name: cargo fmt check
        entry: ./scripts/cargow fmt --all -- --check
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/.*\.rs)$
        stages: [pre-commit]

      - id: cargo-check
        name: cargo check locked
        entry: ./scripts/cargow check --workspace --all-targets --all-features --locked
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/.*\.rs)$
        stages: [pre-commit]

      - id: cargo-clippy-strict
        name: cargo clippy strict
        entry: ./scripts/cargow clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|clippy\.toml|crates/.*/.*\.rs)$
        stages: [pre-push]

      - id: cargo-test
        name: cargo test
        entry: ./scripts/cargow test --workspace --all-features --locked
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/.*\.rs)$
        stages: [pre-push]

      - id: cargo-doc
        name: cargo doc warnings
        entry: bash -lc 'RUSTDOCFLAGS="-D warnings" ./scripts/cargow doc --workspace --all-features --no-deps --locked'
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/.*\.rs)$
        stages: [pre-push]

      - id: workspace-lints
        name: workspace lints inheritance
        entry: python3 scripts/check_workspace_lints.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|.*\.rs|.*/Cargo\.toml|scripts/check_workspace_lints\.py|tools/ci/tests/test_check_workspace_lints\.py)$
        stages: [pre-push]

      - id: hexagonal-boundaries
        name: hexagonal domain boundaries
        entry: python3 tools/ci/lint/lint-hexagonal-boundaries.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/(Cargo\.toml|src/.*\.rs)|tools/ci/lint/lint-hexagonal-boundaries\.py|tools/ci/tests/test_lint_hexagonal_boundaries\.py)$
        stages: [pre-commit, pre-push]

      - id: rust-no-allow
        name: rust no allow attributes
        entry: bash scripts/check-rust-allow-attributes.sh
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|scripts/check-rust-allow-attributes\.sh)$
        stages: [pre-push]

      - id: rust-derive-allowlist
        name: rust derive allowlist
        entry: python3 tools/ci/lint/check-rust-derive-allowlist.py
        language: system
        pass_filenames: false
        files: ^((crates|benchmarks)/.*\.rs|tools/ci/lint/check-rust-derive-allowlist\.py|tools/ci/tests/test_lint_derive_allowlist\.py)$
        stages: [pre-commit, pre-push]

      - id: rust-cargo-toml-hygiene
        name: rust cargo.toml hygiene
        entry: python3 tools/ci/lint/check-cargo-toml-hygiene.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/Cargo\.toml|tools/ci/lint/check-cargo-toml-hygiene\.py|tools/ci/tests/test_check_cargo_toml_hygiene\.py)$
        stages: [pre-commit, pre-push]

      - id: rust-module-discipline
        name: rust module discipline (mod.rs + contract lib.rs facade-only)
        entry: python3 tools/ci/lint/check-module-discipline.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/(src|tests)/.*\.rs|tools/ci/lint/check-module-discipline\.py|tools/ci/tests/test_check_module_discipline\.py)$
        stages: [pre-push]

      - id: rust-module-cycles
        name: rust module cycles (every crate's module graph points one way)
        entry: python3 tools/ci/lint/check-module-cycles.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/src/.*\.rs|tools/ci/lint/(check-module-cycles\.py|baselines/module-cycles\.txt)|tools/ci/tests/test_check_module_cycles\.py)$
        stages: [pre-push]

      - id: dsl-capability-truth
        name: dsl capability truth (docs must not drift from code-owned subset)
        entry: python3 tools/ci/lint/check-dsl-capability-truth.py
        language: system
        pass_filenames: false
        files: ^(crates/quanta-index-core/src/domains/read_view/predicate\.rs|crates/quanta-index-lexical/src/(predicate_registry\.rs|bin/dump_predicate_capabilities\.rs)|crates/quanta-index-search-plane/src/(lowering\.rs|bin/dump_sg_structural_legality\.rs)|tools/ci/lint/check-dsl-capability-truth\.py|docs/plans/may-25-lexical-enhancement/.*|docs/plans/jun-2-dsl-advanced/.*)$
        stages: [pre-push]

      - id: rust-error-shape
        name: rust error shape (pub *Error must implement std::error::Error)
        entry: python3 tools/ci/lint/check-error-shape.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*/src/.*\.rs|tools/ci/lint/check-error-shape\.py|tools/ci/tests/test_check_error_shape\.py)$
        stages: [pre-push]

      - id: rust-wire-inventory
        name: wire-surface inventory (IPC opcodes + on-disk format versions)
        entry: python3 tools/ci/lint/check-wire-inventory.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|tools/ci/inventory/wire-surface\.toml|crates/.*/src/.*\.rs|tools/ci/(proof-authority\.toml|(?:(proof-manifest|proof-aggregate|error-authority-inventory|verification-receipt)\.schema\.json)|lint/check-wire-inventory\.py|tests/(test_check_wire_inventory|test_check_proof_authority|test_write_proof_aggregate|test_write_error_authority_inventory)\.py))$
        stages: [pre-push]

      - id: proof-authority
        name: proof authority registry and manifest schema lint
        entry: python3 tools/ci/lint/check-proof-authority.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^(tools/ci/(proof-authority\.toml|proof-(?:manifest|aggregate)\.schema\.json|write-proof-(?:manifest|aggregate)\.py|lint/check-(?:proof-authority|lane-handoff)\.py|tests/test_check_(?:proof_authority|lane_handoff)\.py|tests/test_write_proof_(?:manifest|aggregate)\.py)|docs/(?:adr/SEP-21-.*\.md|plans/sep-21-search-plane-sota-hardening/tickets/handoffs/lane-handoff\.schema\.json))$
        stages: [pre-commit, pre-push]

      - id: rust-digest-fallibility
        name: rust digest fallibility
        entry: python3 tools/ci/lint/check-digest-fallibility.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|crates/.*\.rs|tools/ci/lint/check-digest-fallibility\.py|tools/ci/tests/test_check_digest_fallibility\.py)$
        stages: [pre-commit, pre-push]

      - id: rust-semantic-outcomes
        name: Rust semantic outcome honesty
        entry: python3 tools/ci/lint/check-semantic-outcomes.py
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|benchmarks/.*\.rs|tools/ci/lint/(check-semantic-outcomes\.py|semantic-outcome-policy\.json)|tools/ci/tests/test_check_semantic_outcomes\.py)$
        stages: [pre-push]

      - id: cargo-deny
        name: cargo deny
        entry: bash scripts/run-cargo-deny.sh
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|deny\.toml|crates/.*/Cargo\.toml)$
        stages: [pre-push]

      - id: cargo-machete
        name: cargo machete (unused deps)
        entry: cargo machete --with-metadata
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/Cargo\.toml)$
        stages: [pre-push]

      - id: cargo-bench-build
        name: cargo bench --no-run
        entry: ./scripts/cargow bench --workspace --all-features --locked --no-run
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|crates/.*/(src|benches)/.*\.rs|crates/.*/Cargo\.toml)$
        stages: [pre-push]

      - id: precommit-scope-tests
        name: pre-commit scope tests
        entry: bash -lc 'source scripts/quanta-index-env.sh && python3 -m pytest tools/ci/tests/test_precommit_scopes.py -q -o cache_dir="$PYTEST_CACHE_DIR"'
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|Justfile|tools/ci/tests/test_precommit_scopes\.py)$
        stages: [pre-push]

      - id: prompt-manager-tests
        name: tooling tests
        entry: bash scripts/run-tooling-tests.sh
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|tools/(?!ci/(?:semgrep/|tests/(?:test_semgrep_|test_precommit_scopes\.py$))).*|scripts/(?:check_workspace_lints\.py|run-tooling-tests\.sh))$
        stages: [pre-push]

      - id: semgrep-rule-tests
        name: Semgrep rule counterexamples
        entry: bash scripts/check-semgrep-rules.sh
        language: system
        pass_filenames: false
        files: ^(tools/ci/semgrep/.*|tools/ci/tests/test_semgrep_.*\.py|scripts/check-semgrep-rules\.sh)$
        stages: [pre-push]

      - id: semgrep
        name: semgrep policy
        entry: bash scripts/run-semgrep.sh
        language: system
        pass_filenames: true
        files: ^(crates/[^/]+/(?:src/.*|fuzz/fuzz_targets/.*)\.rs|benchmarks/[^/]+/src/.*\.rs|\.github/workflows/[^/]+\.ya?ml|tools/ci/semgrep/.*|scripts/run-semgrep\.sh|\.semgrepignore)$
        stages: [pre-push]
