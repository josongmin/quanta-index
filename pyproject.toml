[project]
name = "quanta-index-tools"
version = "0.1.0"
description = "Prompt-manager and developer tooling for quanta-index"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.4",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0.0",
    "semgrep>=1.76.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["target", "state", ".venv", ".cursor", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "unit: fast isolated tests with no external process or filesystem contract",
    "integration: public crate or adapter boundary tests",
    "e2e: process-level smoke tests through a real binary entrypoint",
]
