[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "allow"
deny = [
  { crate = "openssl", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
  { crate = "openssl-sys", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
]
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "MIT",
  "Unicode-3.0",
]
exceptions = []

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
