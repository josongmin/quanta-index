[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  # tantivy 0.22 pulls measure_time -> instant 0.1.13 (unmaintained); no safe
  # upgrade exists in the tantivy 0.22 dep tree.
  { id = "RUSTSEC-2024-0384", reason = "tantivy 0.22 transitive: measure_time -> instant 0.1.13 unmaintained" },
  # tantivy 0.22 pins lru 0.12.5; upstream advisory RUSTSEC-2026-0002 reports an
  # IterMut soundness defect. We do not call IterMut from quanta-index code.
  { id = "RUSTSEC-2026-0002", reason = "tantivy 0.22 transitive: lru 0.12.5 IterMut unsound; not invoked by our code" },
  # Same pinned lru 0.12.5. RUSTSEC-2026-0253: `LruCache::pop()` is not
  # panic-safe if a stored KEY's `Drop` panics. tantivy's only LruCache is
  # `LruCache<usize, Block>` (store/reader.rs); a `usize` key has no `Drop`, so
  # the unsound path cannot be entered. Fixed in lru >=0.18.2, which tantivy
  # 0.22 (`lru ^0.12`) cannot take; drop this entry when tantivy is bumped.
  { id = "RUSTSEC-2026-0253", reason = "tantivy 0.22 transitive: lru 0.12.5 pop() panic-safety unsound; only LruCache<usize, _> is instantiated, and usize has no Drop" },
  # lancedb 0.30 -> datafusion 53 transitive: `paste` proc-macro is no longer
  # maintained. It is a build-time-only macro with no runtime/security impact;
  # widely used across the ecosystem and tracked for replacement upstream.
  { id = "RUSTSEC-2024-0436", reason = "lancedb 0.30 transitive: paste proc-macro unmaintained; build-time only, no runtime/security surface" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "allow"
# The pinned Unicode fork is a workspace member so its controlled scratch tests
# remain in workspace verification. Lance/Lindera also enable its upstream
# default (= std). Preserve that unified graph while requiring this exact,
# reviewed feature set; newly added or unexpectedly disabled features fail.
features = [
  { name = "unicode-normalization", version = "=0.1.25", allow = ["default", "std", "quanta-native-scratch-v1"], exact = true },
]
deny = [
  { crate = "openssl", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
  { crate = "openssl-sys", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
]
skip = []
skip-tree = [
  # tantivy 0.22 pulls fs4 0.8 (rustix 0.38 / linux-raw-sys 0.4) which
  # conflicts with tempfile's rustix 1.x / linux-raw-sys 0.12. Scope the
  # skip-tree to fs4 so the bypass is bounded to that subtree.
  { crate = "fs4@0.8", reason = "tantivy 0.22 transitive duplicate of rustix / linux-raw-sys via fs4" },
  # tantivy 0.22 -> rand 0.8 -> getrandom 0.2 / rand_core 0.6 conflicts with
  # tempfile's getrandom 0.3 line. Scope the bypass to rand 0.8.
  { crate = "rand@0.8", reason = "tantivy 0.22 transitive duplicate of getrandom via rand 0.8 / rand_core 0.6" },
  # tantivy 0.22 -> lru 0.12 -> hashbrown 0.15 conflicts with rusqlite's
  # hashbrown 0.14 (via hashlink). Scope the bypass to the lru subtree.
  { crate = "lru@0.12", reason = "tantivy 0.22 transitive duplicate of hashbrown via lru 0.12" },
  # tantivy 0.22 -> uuid -> getrandom 0.3 is a second getrandom edge separate
  # from the rand 0.8 / 0.2 path. Scope to uuid.
  { crate = "uuid@1", reason = "tantivy 0.22 transitive duplicate of getrandom via uuid" },
  # lancedb 0.30 -> lance + datafusion 53 + reqwest pulls in ~20 internal
  # duplicate versions (arrow-array/arrow-buffer/hashbrown/itertools/thiserror
  # /strum/nom/phf/...). The duplicates are entirely *inside* lancedb's tree
  # and don't escape to our crates. Scope the bypass to the whole lancedb
  # subtree rather than enumerating each transitive dep.
  { crate = "lancedb@0.30", reason = "lancedb 0.30 transitive duplicates: contained inside the lancedb subtree" },
]

[licenses]
confidence-threshold = 0.93
# Allow-list policy: every license here MUST be OSI-approved and permissive
# (commercial-use-safe, no carry-over copyleft for typical linking).
#
# BSD-3-Clause, MPL-2.0, ISC, BSL-1.0 were added when the lancedb 0.30
# subtree landed (LDB-00 packet outcome): lancedb -> lance + datafusion +
# reqwest/rustls + lindera pulls in ~60 crates under these four additional
# permissive licenses. Listing them globally (rather than 60 per-crate
# exceptions) keeps the file reviewable; each license is independently
# OSI-approved + FSF-libre and carries no risk above the existing allowlist.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]
exceptions = [
  # tantivy 0.22 transitive: hashbrown -> foldhash 0.1.5 is Zlib-licensed.
  # Permissive license but not in baseline allowlist; scope the exception
  # tightly to the crate.
  { name = "foldhash", allow = ["Zlib"] },
  # lancedb 0.30 -> reqwest/rustls: webpki-roots distributes CA trust-anchor
  # data under CDLA-Permissive-2.0. Keep this non-code data license exception
  # constrained to the exact transitive package rather than widening allow.
  { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
