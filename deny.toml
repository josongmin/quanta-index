[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  # Lance 7 and DataFusion 53 still transitively use `paste`. This proc-macro is no longer
  # maintained. It is a build-time-only macro with no runtime/security impact;
  # widely used across the ecosystem and tracked for replacement upstream.
  { id = "RUSTSEC-2024-0436", reason = "DataFusion and Lance transitive: paste proc-macro unmaintained; build-time only, no runtime/security surface" },
  { id = "RUSTSEC-2026-0543", reason = "Maintenance notice for chrono; pinned Arrow 58, DataFusion 53 and Lance 7 require its time types. Revisit with the columnar stack upgrade." },
  { id = "RUSTSEC-2026-0555", reason = "Maintenance notice for chrono-tz; pinned Arrow 58 and DataFusion 53 use its time-zone types. Revisit with the columnar stack upgrade." },
  { id = "RUSTSEC-2026-0542", reason = "Maintenance notice for humantime; pinned Lance 7 and object_store 0.13 still depend on it. Revisit with the columnar stack upgrade." },
  { id = "RUSTSEC-2024-0449", reason = "The independent LanceDB comparison oracle retains upstream serde_yaml_ng. The root graph bans unsafe-libyaml." },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "allow"
# The registry Unicode tables are pinned with their upstream standard-library features.
features = [
  { name = "unicode-normalization", version = "=0.1.25", allow = ["default", "std"], exact = true },
  # Criterion uses the registry Ciborium default feature, which enables std.
  { name = "ciborium", version = "=0.2.2", allow = ["default", "std"], exact = true },
]
deny = [
  { crate = "openssl", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
  { crate = "openssl-sys", use-instead = "rustls", reason = "Prefer Rust-native TLS unless a crate-specific exception is approved." },
  { crate = "unsafe-libyaml", reason = "Keep the retired upstream YAML stack out of the product graph. The isolated LanceDB comparison oracle has its own lockfile." },
]
skip = [
  { name = "base64", version = "=0.13.1", reason = "The SentencePiece tokenizer's spm_precompiled requires 0.13." },
  { name = "cpufeatures", version = "=0.2.17", reason = "SHA-2 and curve25519-dalek require 0.2; BLAKE3 uses 0.3." },
  { name = "darling", version = "=0.20.11", reason = "Lance's derive_builder 0.20 requires darling 0.20." },
  { name = "darling_core", version = "=0.20.11", reason = "The darling 0.20 proc-macro family pins these internal crates together." },
  { name = "darling_macro", version = "=0.20.11", reason = "The darling 0.20 proc-macro family pins these internal crates together." },
  { name = "foldhash", version = "=0.1.5", reason = "Petgraph's hashbrown 0.15 requires foldhash 0.1." },
  { name = "getrandom", version = "=0.2.17", reason = "ring 0.17 requires getrandom 0.2." },
  { name = "getrandom", version = "=0.3.4", reason = "rand 0.9, ahash and tokenizers require getrandom 0.3." },
  { name = "hashbrown", version = "=0.14.5", reason = "DashMap 6 requires hashbrown 0.14." },
  { name = "hashbrown", version = "=0.15.5", reason = "Petgraph 0.8 requires hashbrown 0.15." },
  { name = "hashbrown", version = "=0.16.1", reason = "DataFusion 53 requires hashbrown 0.16." },
  { name = "itertools", version = "=0.13.0", reason = "Lance 7 and bindgen 0.72 require itertools 0.13." },
  { name = "ndarray", version = "=0.15.6", reason = "model2vec-rs 0.3 requires ndarray 0.15; Lance 7 uses 0.16." },
  { name = "nom", version = "=7.1.3", reason = "cexpr and spm_precompiled require nom 7; jsonb uses nom 8." },
  { name = "rand_core", version = "=0.6.4", reason = "Ed25519-dalek 2 requires rand_core 0.6." },
  { name = "shlex", version = "=1.3.0", reason = "bindgen 0.72 requires shlex 1; cc uses shlex 2." },
  { name = "syn", version = "=1.0.109", reason = "Lance's deepsize_derive uses syn 1." },
]

[licenses]
confidence-threshold = 0.93
# Allow-list policy: every license here MUST be OSI-approved and permissive
# (commercial-use-safe, no carry-over copyleft for typical linking).
#
# BSD-3-Clause, MPL-2.0, ISC, BSL-1.0 were added when the lancedb 0.30
# subtree landed (LDB-00 packet outcome): lancedb -> lance + datafusion +
# reqwest/rustls + lindera pulls in ~60 crates under these four additional
# permissive licenses. Listing them globally (rather than 60 per-crate
# exceptions) keeps the file reviewable; each license is independently
# OSI-approved + FSF-libre and carries no risk above the existing allowlist.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]
exceptions = [
  # The hashbrown dependency family includes Zlib-licensed foldhash 0.1.5.
  # Permissive license but not in baseline allowlist; scope the exception
  # tightly to the crate.
  { name = "foldhash", allow = ["Zlib"] },
  # LLVM libFuzzer in the two standalone fuzz workspaces.
  { name = "libfuzzer-sys", version = "=0.4.13", allow = ["NCSA"] },
  # reqwest/rustls: webpki-roots distributes CA trust-anchor
  # data under CDLA-Permissive-2.0. Keep this non-code data license exception
  # constrained to the exact transitive package rather than widening allow.
  { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
