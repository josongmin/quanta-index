# Build artifacts live outside the repo under the shared cache root.
#
# Preferred entrypoints:
# - `./scripts/cargow ...`
# - `just <recipe>`
#
# Both source `scripts/quanta-index-env.sh`, which exports:
#   CARGO_TARGET_DIR=$QUANTA_INDEX_CACHE_ROOT/target/$QUANTA_INDEX_BUILD_LANE
#
# Default cache roots:
#   macOS: ~/Library/Caches/quanta-index
#   Linux: ${XDG_CACHE_HOME:-~/.cache}/quanta-index

# Use the configured Git credential helper for the private SSTable patch.
[net]
git-fetch-with-cli = true
