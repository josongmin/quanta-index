rules:
  - id: rust-no-unwrap
    message: Avoid unwrap/expect in Rust code. Propagate or assert through Result-returning tests instead.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $EXPR.unwrap()
          - pattern: $EXPR.unwrap_err()
          - pattern: $EXPR.expect($MSG)
          - pattern: $EXPR.expect_err($MSG)

  - id: rust-no-result-ok
    message: Do not discard Rust Result errors with ok(). Propagate or map the failure explicitly.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern: $EXPR.ok()

  - id: rust-no-todo
    message: Do not leave todo!/unimplemented! in Rust code.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: todo!()
          - pattern: todo!($MSG)
          - pattern: unimplemented!()
          - pattern: unimplemented!($MSG)

  - id: rust-no-panic
    message: Do not use panic! in Rust code. Return an error or assert through Result-returning tests instead.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: panic!()
          - pattern: panic!($MSG)
          - pattern: panic!($FMT, ...)

  - id: rust-no-dbg
    message: Do not leave dbg! in Rust code.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern: dbg!(...)

  - id: rust-no-allow-attributes
    message: Do not use #[allow] in Rust code. Use #[expect(..., reason = ...)] only when a bounded exception is approved.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-regex: '#!?\[allow\('

  - id: python-no-except-pass
    message: Do not swallow Python exceptions with pass.
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              try:
                ...
              except Exception:
                pass
          - pattern: |
              try:
                ...
              except:
                pass

  - id: bash-no-ignore-failure
    message: Do not suppress shell failures with set +e or || true.
    languages: [bash]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: set +e
          - pattern: $CMD || true

  - id: workflow-use-cargow
    message: CI should route Cargo through ./scripts/cargow so build artifacts stay outside the repo.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
    patterns:
      - pattern-regex: '(?m)run:\\s+.*\\bcargo\\b'

  - id: workflow-no-continue-on-error
    message: CI must fail closed. Do not mark workflow steps as continue-on-error.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
    pattern-regex: '(?m)^\\s*continue-on-error:\\s*true\\s*$'

  - id: core-no-vendor-import
    message: quanta-index-core must stay vendor-neutral. Put rusqlite/tantivy/lancedb in adapter crates.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-core/**"
    patterns:
      - pattern-either:
          - pattern: use rusqlite
          - pattern: use tantivy
          - pattern: use lancedb
          - pattern: use lance

  - id: contract-no-port-trait
    message: Port traits belong in quanta-index-core domains, not the contract crate.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-contract/**"
    pattern: |
      pub trait $NAME { ... }

  - id: rust-no-serde-derive
    message: |
      Serde proc-macro derives are banned workspace-wide. Write manual
      `impl serde::Serialize for T` / `impl<'de> serde::Deserialize<'de> for T`
      instead. Reason: derive expansion dominates cold-build time and hides the
      wire shape from review.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-regex: '#\[derive\([^)]*\b(?:serde::)?(?:Serialize|Deserialize)\b[^)]*\)\]'

  - id: rust-no-silent-or-else-ok
    message: |
      `.or_else(|_| Ok(...))` silently converts an error into a synthesized
      success. Propagate the failure or surface a typed domain error.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $E.or_else(|_| Ok($DEFAULT))
          - pattern: $E.or_else(|$_E| Ok($DEFAULT))

  - id: rust-no-err-arm-default
    message: |
      `Err(_) => Default::default()` (or `T::default()` / numeric-zero / empty-
      collection equivalents) substitutes a placeholder for a real failure on
      a production code path. Propagate via `?`, convert with `.map_err`, or
      mark the operation `blocked`.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-contract/src/**"
        - "/crates/quanta-index-core/src/**"
        - "/crates/quanta-index-ipc/src/**"
        - "/crates/quanta-index-searchd/src/**"
        - "/crates/quanta-index-lexical/src/**"
        - "/crates/quanta-index-semantic/src/**"
        - "/crates/quanta-index-control/src/**"
    patterns:
      - pattern-either:
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*Default\s*::\s*default\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*Self\s*::\s*default\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*Vec\s*::\s*new\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*String\s*::\s*new\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*BTreeMap\s*::\s*new\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*BTreeSet\s*::\s*new\s*\(\s*\)'
          - pattern-regex: 'Err\(\s*_\s*\)\s*=>\s*None\b'

  - id: rust-no-debug-assertions-divergence
    message: |
      `cfg!(debug_assertions)` / `#[cfg(debug_assertions)]` on a production
      module makes release-mode behavior diverge from debug-mode behavior.
      That is a silent-failure shape: bugs trigger in tests but slip in prod.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-core/src/**"
        - "/crates/quanta-index-contract/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern-either:
          - pattern-regex: 'cfg!\s*\(\s*debug_assertions\s*\)'
          - pattern-regex: '#\[\s*cfg\s*\(\s*debug_assertions\s*\)'

  - id: rust-no-result-to-option-discard
    message: |
      `.err().is_some()` / `result.ok().is_none()` style discards the error
      payload. If you only care about success, use `is_ok()` / `is_err()`;
      otherwise destructure to preserve the error.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $E.err().is_some()
          - pattern: $E.err().is_none()

  - id: rust-no-is-ok-as-branch
    message: |
      Heuristic-fallback pattern banned: `if x.is_ok() { ... } else { ... }`
      splits execution on error without typed propagation. The else branch
      becomes a silent fallback (alternate algorithm / default value / no-op)
      that masks the typed Err. Use `?` propagation or `match { Ok(v) => ...,
      Err(e) => return Err(...) }`. Single-branch `if x.is_err() { return
      Err(...); }` is permitted because it propagates explicitly.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "crates/*/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern: |
          if $X.is_ok() {
              ...
          } else {
              ...
          }

  - id: rust-no-is-err-as-branch
    message: |
      Heuristic-fallback pattern banned: `if x.is_err() { ... } else { ... }`
      with both branches non-empty inverts the same shape as
      `rust-no-is-ok-as-branch`. The non-err branch becomes a silent fallback.
      Single-branch `if x.is_err() { return Err(...); }` is permitted.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "crates/*/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern: |
          if $X.is_err() {
              ...
          } else {
              ...
          }

  # NOTE: a `rust-no-map-or-else-non-err` rule was considered to catch
  # `Result::map_or(default, ...)` / `map_or_else` fallback patterns, but
  # semgrep cannot distinguish `Option::map_or` (legitimate) from
  # `Result::map_or` (a fallback) at the pattern level — and the
  # `usize::try_from(x).map_or(MAX, |v| v)` saturation idiom is common
  # enough that the false-positive rate (~6 of 7 hits in the LQ tree)
  # outweighs the catch. Coverage of the same shape is instead handled
  # by `tools/ci/lint/check-digest-fallibility.py` for digest functions
  # and by manual code review for other call sites.
