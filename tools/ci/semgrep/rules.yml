rules:
  # Keep only checks without an equivalent, independently gated owner.
  # Rust derives, #[allow], and contract port placement belong to dedicated
  # repository linters; Clippy owns Result::ok, wildcard Err arms, and
  # unwrap/expect/panic/debug.

  - id: workflow-use-cargow
    message: Standard Cargo build/check/test/fmt/doc/bench/nextest CI commands must use ./scripts/cargow; cargo-machete, cargo-miri, and cargo-fuzz are tool-owned exceptions.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
        - "/.github/workflows/*.yaml"
    pattern-regex: '(?m)^[ \t]*(?:(?!\b(?:name|source)\s*:|#)[^\n])*?(?<![A-Za-z0-9_./-])cargo[ \t]+(?:build|check|clippy|test|fmt|doc|bench|nextest)\b'

  - id: workflow-no-continue-on-error
    message: CI must fail closed. Do not mark workflow steps as continue-on-error.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
        - "/.github/workflows/*.yaml"
    pattern-regex: '(?m)^[ \t]*(?:-[ \t]*)?continue-on-error:[ \t]*true[ \t]*(?:#.*)?$'

  - id: rust-no-silent-or-else-ok
    message: |
      `.or_else(|_| Ok(...))` silently converts an error into a synthesized
      success. Propagate the failure or surface a typed domain error.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/*/src/**"
        - "/crates/*/fuzz/fuzz_targets/**"
        - "/benchmarks/*/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern-either:
          - pattern: $E.or_else(|_| Ok($DEFAULT))
          - pattern: $E.or_else(|$_E| Ok($DEFAULT))
          - pattern: $E.or_else(|_| { ...; Ok($DEFAULT) })
          - pattern: $E.or_else(|$_E| { ...; Ok($DEFAULT) })

  - id: rust-no-debug-assertions-divergence
    message: |
      `cfg!(debug_assertions)` / `#[cfg(debug_assertions)]` on a production
      module makes release-mode behavior diverge from debug-mode behavior.
      That is a silent-failure shape: bugs trigger in tests but slip in prod.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-core/src/**"
        - "/crates/quanta-index-contract/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern-either:
          - pattern-regex: 'cfg!\s*\(\s*debug_assertions\s*\)'
          - pattern-regex: '#\[\s*cfg\s*\(\s*debug_assertions\s*\)'

  - id: rust-no-is-ok-as-branch
    message: |
      Heuristic-fallback pattern banned: `if x.is_ok() { ... } else { ... }`
      splits execution on error without typed propagation. The else branch
      becomes a silent fallback (alternate algorithm / default value / no-op)
      that masks the typed Err. Use `?` propagation or `match { Ok(v) => ...,
      Err(e) => return Err(...) }`. Single-branch `if x.is_err() { return
      Err(...); }` is permitted because it propagates explicitly.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/*/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern: |
          if $X.is_ok() {
              ...
          } else {
              ...
          }
      # Checked integer representability is a predicate, not a fallback.
      # Clippy's checked_conversions lint requires this spelling instead of
      # comparing with u8/u16/u32::MAX in canonical CBOR width validation.
      - pattern-not: |
          if u8::try_from($VALUE).is_ok() {
              ...
          } else {
              ...
          }
      - pattern-not: |
          if u16::try_from($VALUE).is_ok() {
              ...
          } else {
              ...
          }
      - pattern-not: |
          if u32::try_from($VALUE).is_ok() {
              ...
          } else {
              ...
          }

  - id: rust-no-is-err-as-branch
    message: |
      Heuristic-fallback pattern banned: `if x.is_err() { ... } else { ... }`
      with both branches non-empty inverts the same shape as
      `rust-no-is-ok-as-branch`. The non-err branch becomes a silent fallback.
      Single-branch `if x.is_err() { return Err(...); }` is permitted.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/*/src/**"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
    patterns:
      - pattern: |
          if $X.is_err() {
              ...
          } else {
              ...
          }

  - id: rust-no-ready-on-failed-structural-precondition
    message: |
      Do not advertise `StructuralReadiness::Ready` when a prerequisite
      `Result` failed. Return a fail-closed readiness state such as
      `InvalidRequest` or `ProducerExecution` instead.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-searchd/src/**"
    pattern-regex: 'let\s+Ok\([^)]*\)\s*=\s*[^;]+else\s*\{\s*return\s+StructuralReadiness::Ready;'

  # A public V<n> name is not evidence of a parallel internal IR. RepoMap's
  # versioned address/evidence types are consumed by current layout contracts;
  # blanket suffix rejection conflicted with those contracts and a nonexistent
  # lq-ranker path. Guard actual IR duplication at its producer/consumer boundary.

  - id: rust-no-search-plane-direct-ciborium
    message: |
      `quanta-index-search-plane` must not name `ciborium` directly on
      production paths. Route CBOR encode/decode through `quanta-index-ipc`.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-search-plane/src/**"
    pattern-regex: '\bciborium::'

  - id: search-plane-no-process-spawn
    message: |
      The search-plane crate has no direct process-launch authority. Keep
      producer-owned source/Git/parser work in the producer, and route any
      other external process through an explicit composition boundary.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-search-plane/src/**"
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: Command::new(...)
          - pattern: std::process::Command::new(...)
          - pattern-regex: '(?m)^\s*use\s+(?:std|tokio)::process\b'

  - id: search-plane-no-producer-parser-import
    message: |
      Git and parse-tree ownership belongs to the producer, not the search plane.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "/crates/quanta-index-search-plane/src/**"
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern-regex: '(?m)^\s*(?:use|extern crate)\s+(?:git2|tree_sitter(?:_language_pack)?)\b'
          - pattern-regex: '(?m)^(?!\s*(?://|/\*|\*))[^\n]*\b(?:git2|tree_sitter(?:_language_pack)?)::'

  # NOTE: a `rust-no-map-or-else-non-err` rule was considered to catch
  # `Result::map_or(default, ...)` / `map_or_else` fallback patterns, but
  # semgrep cannot distinguish `Option::map_or` (legitimate) from
  # `Result::map_or` (a fallback) at the pattern level — and the
  # `usize::try_from(x).map_or(MAX, |v| v)` saturation idiom is common
  # enough that the false-positive rate (~6 of 7 hits in the LQ tree)
  # outweighs the catch. Coverage of the same shape is instead handled
  # by `tools/ci/lint/check-digest-fallibility.py` for digest functions
  # and by manual code review for other call sites.
