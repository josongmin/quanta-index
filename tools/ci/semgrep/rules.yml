rules:
  # Keep only checks without an equivalent, independently gated owner.
  # Rust derives, #[allow], and contract port placement belong to dedicated
  # repository linters; Clippy owns Result::ok, wildcard Err arms, and
  # unwrap/expect/panic/debug.

  - id: workflow-use-cargow
    message: Standard Cargo build/check/test/fmt/doc/bench/nextest CI commands must use ./scripts/cargow; cargo-machete, cargo-miri, and cargo-fuzz are tool-owned exceptions.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
        - "/.github/workflows/*.yaml"
    # Cargo accepts global options between [+toolchain] and COMMAND. Keep the
    # option grammar explicit so unrelated workflow prose is not treated as a
    # Cargo invocation merely because it contains an arbitrary --word.
    pattern-regex: >-
      (?mx)
      ^(?![ \t]*(?:-\s*)?(?:name|source)\s*:|[ \t]*\#)
      [ \t]*[^\n]*?(?<![A-Za-z0-9_./-])cargo
      (?:[ \t]|\\[ \t]*\r?\n[ \t]*)+
      (?:\+[A-Za-z0-9][A-Za-z0-9._-]*(?:[ \t]|\\[ \t]*\r?\n[ \t]*)+)?
      (?:
        (?:
          --(?:locked|offline|frozen|verbose|quiet)
          | -[vq]+
          | (?:--(?:config|color)|-Z|-C)
            (?:=|(?:[ \t]|\\[ \t]*\r?\n[ \t]*)+)
            (?:"[^"\r\n]*"|'[^'\r\n]*'|[^ \t\r\n]+)
          | (?:-Z|-C)(?:"[^"\r\n]*"|'[^'\r\n]*'|[^ \t\r\n]+)
        )
        (?:[ \t]|\\[ \t]*\r?\n[ \t]*)+
      )*
      (?:build|check|clippy|test|fmt|doc|bench|nextest)\b

  - id: workflow-no-continue-on-error
    message: CI must fail closed. Do not declare continue-on-error on jobs or steps.
    languages: [yaml]
    severity: ERROR
    paths:
      include:
        - "/.github/workflows/*.yml"
        - "/.github/workflows/*.yaml"
    pattern: 'continue-on-error: $VALUE'
