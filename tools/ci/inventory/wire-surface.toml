notes = "Tantivy 0.22 segment files (immutable, hard-linked across delta generations) plus the two generation-local files Tantivy rewrites in place. `meta.json` and every segment component file it references are committed by the sealed manifest (length + sha256); `.managed.json` and lock files are Tantivy bookkeeping a query never decodes and are not committed. The schema lives in `meta.json`; every door refuses an index whose schema is not the one the running build writes (from sealed-manifest format 5, `text_authority_doc_id` is indexed and a fast column; from format 6, `candidate_id`, `repo_relative_path`, `start_line` and `end_line` are fast columns)."

[[artifact]]
