[[artifact]]
id = "lexical-sealed-manifest"
owner = "quanta-index-lexical"
path = "state_root/indexes/lexical/generation-v1-<sha256(repo,revision)>/g<N>/search-corpus-generation-manifest.cbor"
reproduction = "producer-rebuild"
notes = "Seal commitment (QI-BB-030): identity digest, normalizer stamp, Tantivy meta.json (length + sha256), every segment component file the commit references (length + sha256; content proved at seal and by scrub, length at the doors), the text-authority tree, and every repo-metadata overlay present. Format 5 added each text document's text-authority doc id indexed and as a fast column (the bitmap restriction of QI-BB-024); format 6 adds the ranked page order's columns (candidate id, path, start and end line) as fast columns (the stored-document-free page and projection collectors of QI-BB-005). Formats 1-5 are refused typed (2 by the text-authority format code); rebuild is the migration."
[[artifact.version_constants]]
file = "crates/quanta-index-lexical/src/sealed_generation/manifest.rs"
name = "LEXICAL_SEALED_MANIFEST_FORMAT_VERSION"
value = 6
[[artifact.version_constants]]
file = "crates/quanta-index-lexical/src/sealed_generation/manifest.rs"
name = "LEXICAL_SEALED_MANIFEST_WHOLE_CORPUS_TEXT_AUTHORITY_VERSION"
value = 2

[[artifact]]
id = "lexical-scrub-receipts"
owner = "quanta-index-lexical"
path = "state_root/indexes/lexical/generation-v1-<sha256(repo,revision)>/g<N>/{search-corpus-generation-scrub.cbor,search-corpus-generation-quarantine.cbor}"
reproduction = "cache"
notes = "Receipts the integrity scrub leaves beside a sealed lexical generation (QI-BB-017): the completed pass (the manifest digest it proved, its completion epoch, files and bytes covered; staleness order for the maintenance scheduler and the boot scrape; format 2 records Unix seconds from the adapter clock, format 1 was a caller stamp and is refused), and the durable quarantine written when a committed file no longer matches the seal (the inventory sets the generation aside as GENERATION_QUARANTINE_CONTENT_CORRUPT and every door refuses it as GENERATION_QUARANTINED). Neither is part of the sealed commitment; a scrub receipt is regenerable by the next pass, a quarantine receipt leaves only through the quarantine discard."
[[artifact.version_constants]]
file = "crates/quanta-index-lexical/src/sealed_generation/scrub.rs"
name = "LEXICAL_SCRUB_RECEIPT_FORMAT_VERSION"
value = 2
[[artifact.version_constants]]
file = "crates/quanta-index-lexical/src/sealed_generation/scrub.rs"
name = "LEXICAL_QUARANTINE_RECEIPT_FORMAT_VERSION"
value = 1

[[artifact]]
