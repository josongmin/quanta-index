# Consumer / wire-surface inventory (plan §11 "State/wire migration" item 1).
#
# Machine-checked by `tools/ci/lint/check-wire-inventory.py` (`just
# rust-wire-inventory`, part of `just rust-policy`):
#
#   * every `SearchPlane{Query,Control,Ingest}Ipc{Request,Response}` variant
#     in `crates/quanta-index-contract/src/ipc/{split,ingest}.rs` must be
#     listed under `[[ipc]]`, and nothing may be listed that the code does
#     not have;
#   * every on-disk format-version constant in workspace `src/` trees
#     (`*FORMAT_VERSION*`, `*_SCHEMA_V<n>`, `*CONTRACT_VERSION`,
#     `RECEIPT_FORMAT`, plus the text normalizer stamp) must be named by
#     exactly one `[[artifact]]` with the value the code declares.
#
# The `reproduction` field is the cutover classification plan §11 asks for:
#
#   producer-rebuild     the artifact is derived from producer batches and is
#                        rebuilt at a new state root by replaying them to the
#                        same durable high-water (cost noted per row: embedding
#                        calls, wall time, extra disk);
#   offline-importer     the artifact holds state producers cannot re-send
#                        (activation choice, operation dedup, sealed lineage,
#                        runtime overlays); an explicit importer must carry it;
#   migration-input-only the file is read once by a boot-time migration and
#                        deleted; it must not exist at a new root;
#   cache                regenerable on demand; may be dropped at cutover at
#                        the cost of provider calls;
#   vendor-native        bytes owned by a vendor library and reproduced by the
#                        owning adapter's build; never copied by hand.

schema = 1

