# Consumer / wire-surface inventory (plan §11 "State/wire migration" item 1).
#
# Machine-checked by `tools/ci/lint/check-wire-inventory.py` (`just
# rust-wire-inventory`, part of `just rust-policy`):
#
#   * every `SearchPlane{Query,Control,Ingest}Ipc{Request,Response}` variant
#     in `crates/quanta-index-contract/src/ipc/{split,ingest}.rs` must be
#     listed under `[[ipc]]`, and nothing may be listed that the code does
#     not have;
#   * every on-disk format-version constant in workspace `src/` trees
#     (`*FORMAT_VERSION*`, `*_SCHEMA_V<n>`, `*CONTRACT_VERSION`,
#     `RECEIPT_FORMAT`, plus the text normalizer stamp) must be named by
#     exactly one `[[artifact]]` with the value the code declares.
#   * every `[[tool_artifact]]` must name its owner, producer, consumers,
#     decoder, compatibility rule and JSON schema; the registered version
#     must equal that schema's `schema_version` constant.
#
# The `reproduction` field is the cutover classification plan §11 asks for:
#
#   producer-rebuild     the artifact is derived from producer batches and is
#                        rebuilt at a new state root by replaying them to the
#                        same durable high-water (cost noted per row: embedding
#                        calls, wall time, extra disk);
#   offline-importer     the artifact holds state producers cannot re-send
#                        (activation choice, operation dedup, sealed lineage,
#                        runtime overlays); an explicit importer must carry it;
#   migration-input-only the file is read once by a boot-time migration and
#                        deleted; it must not exist at a new root;
#   cache                regenerable on demand; may be dropped at cutover at
#                        the cost of provider calls;
#   vendor-native        bytes owned by a vendor library and reproduced by the
#                        owning adapter's build; never copied by hand.

schema = 2

# ---------------------------------------------------------------------------
# Tools-owned proof and verification formats
# ---------------------------------------------------------------------------

[[tool_artifact]]
id = "proof-manifest-v1"
owner = "tools/ci/proof-authority.toml"
path = "artifacts/proof-authority/<proof-id>.json"
producer = "registered command in tools/ci/proof-authority.toml"
consumers = ["tools/ci/lint/check-proof-authority.py", "release qualification aggregator"]
version = 1
schema_file = "tools/ci/proof-manifest.schema.json"
decoder = "tools/ci/lint/check-proof-authority.py"
compatibility = "Only schema 1 is accepted. Missing, stale, unregistered or other-version manifests are refused; there is no fallback decoder."
migration_fixture = "proof_manifest_v0_refused"
notes = "Source, dirty tree, command/profile/target/filter, counts, host, daemon binary, dependency receipts and raw artifacts are independently re-hashed before a passed proof is admitted."

[[tool_artifact]]
id = "proof-aggregate-v1"
owner = "tools/ci/proof-authority.toml"
path = "artifacts/proof-authority/p12-release-aggregate.json"
producer = "tools/ci/write-proof-aggregate.py"
consumers = ["tools/ci/lint/check-proof-authority.py", "tools/ci/write-proof-manifest.py"]
version = 1
schema_file = "tools/ci/proof-aggregate.schema.json"
decoder = "tools/ci/lint/check-proof-authority.py"
compatibility = "Only schema 1 is accepted. The receipt is regenerated from the complete registered dependency closure; missing, diagnostic, stale or source-divergent receipts cannot issue P12."
migration_fixture = "proof_aggregate_missing_or_not_ready_refused"
notes = "Carries independent CODE_QUALIFIED, DEPLOYED, ACTIVATED and ROLLBACK_PROVEN verdicts plus exact source-pair, release daemon, host and state-root bindings."

[[tool_artifact]]
id = "error-authority-inventory-v1"
owner = "tools/ci/write-error-authority-inventory.py"
path = "artifacts/sep-21/p00/error-authority-inventory.json"
producer = "tools/ci/write-error-authority-inventory.py"
consumers = ["P00 handoff", "P01A error-code migration discovery input"]
version = 1
schema_file = "tools/ci/error-authority-inventory.schema.json"
decoder = "tools/ci/write-error-authority-inventory.py"
compatibility = "Only schema 1 is accepted. The artifact is regenerated from every crates/*/src/**/*.rs byte and is never reused across a different source head or source digest."
migration_fixture = "error_authority_inventory_source_digest_changes"
notes = "Source-bound discovery inventory only. It always records closed=false; regex matches cannot become semantic completion authority. P01A must land independent enum/table/mapping/SDK validators and owner proof."

[[tool_artifact]]
id = "search-plane-error-codes-v2"
owner = "crates/quanta-index-contract/src/ipc/error.rs"
path = "tools/ci/inventory/search-plane-error-codes.json"
producer = "tools/ci/check-search-plane-error-codes.py --write"
consumers = ["tools/ci/check-error-authority-closure.py", "P01A and downstream proof authority"]
version = 2
schema_file = "tools/ci/search-plane-error-code-table.schema.json"
decoder = "tools/ci/check-search-plane-error-codes.py"
compatibility = "Only the exact sorted closed enum-source table with the frozen domain-separated source digest is accepted. Unknown and retired wire codes fail decode."
migration_fixture = "search_plane_error_table_stale_content_refused"
notes = "P01A-owned accepted error-code authority. The P00 regex discovery inventory cannot certify closure."

[[tool_artifact]]
id = "verification-receipt-v1-legacy"
owner = "tools/ci/write-verification-receipt.py"
path = "artifacts/test-authority/receipt.json"
producer = "tools/ci/write-verification-receipt.py"
consumers = ["GitHub Actions artifact browser"]
version = 1
schema_file = "tools/ci/verification-receipt.schema.json"
decoder = "tools/ci/write-verification-receipt.py"
compatibility = "Legacy CI receipt only; ProofManifestV1 validators never accept it as release authority. It is replaced, not upgraded live."
migration_fixture = "verification_receipt_v1_not_release_authority"
notes = "Retained temporarily for existing CI consumers. S21-13 removes it after all producers emit ProofManifestV1."

