[package]
name = "tree-sitter-registry-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
quanta-index-contract = { path = "../../../crates/quanta-index-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "=0.25.10"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
