# SEP-21 proof authority. The registry is declarative; evidence is valid only
# when a strict ProofManifestV1 names one of these nodes and passes the checker.
schema = 2

# A staged proof is a declared future owner, not executable release authority.
# The manifest writer and validator refuse staged proofs even when a file is
# present at the registered artifact path. Moving a proof to `executable`
# requires its concrete test-authority targets (or the two closed non-test
# modes below) to be in place first.

[aggregate]
id = "p12-release-aggregate"
target_proof = "p12-final-qualification"
schema = "tools/ci/proof-aggregate.schema.json"
artifact = "artifacts/proof-authority/p12-release-aggregate.json"

[aggregate.verdicts]
CODE_QUALIFIED = ["p00-authority-freeze", "p01-canonical-identity", "p02a-repomap-compiler", "p02b-operation-journal", "p03-candidate-activation", "p04-read-view-lifetime", "p05-query-truth", "p06-sdk-binding", "p07-provider-boundary", "p08-runtime-supervisor", "p09-control-readiness", "p10-state-migration", "p11-cross-repo-cutover"]
DEPLOYED = ["p11-deployment"]
ACTIVATED = ["p11-activation"]
ROLLBACK_PROVEN = ["p10-state-migration", "p11-rollback"]

[families.S]
name = "static-policy"
description = "Architecture, public API, wire, module and policy guards."

[families.U]
name = "owner-unit"
description = "Owner-local positive, negative and recovery proof."

[families.A]
name = "real-adapter"
description = "Real SQLite, Tantivy, Lance or RepoMap adapter proof."

[families.D]
name = "daemon-consumer"
description = "Real SDK/UDS consumer proof against the daemon boundary."

[families.P]
name = "process"
description = "Child-process signal, crash, restart, lease and readiness proof."

[families.F]
name = "fault-concurrency"
description = "Corruption, failpoint, concurrency and cancellation proof."

[families.Q]
name = "quality-performance"
description = "Independent relevance, ANN, latency and resource proof."

[families.X]
name = "external"
description = "External producer, provider, migration or deployment proof."

