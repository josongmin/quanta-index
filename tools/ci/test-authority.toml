# Test authority SSOT (QIT-00).
#
# A target is not considered covered merely because a broad command happens to
# discover it today. Every Cargo integration binary and cargo-fuzz target must
# be named here with its owning crate and an executable CI rail. Registered
# Python owner targets have an explicit file, scope, and CI rail. The companion
# guard fails when the filesystem, a fuzz manifest, or this catalog diverges.

format_version = 2

[rails.pr-workspace-nextest]
tier = "pr"
command = "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1"
target_kind = "integration"
workflow = ".circleci/config.yml"
job = "verify"
step = "rust nextest"

[rails.main-workspace-nextest]
tier = "main"
command = "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1"
target_kind = "integration"
workflow = ".circleci/config.yml"
job = "verify"
step = "rust nextest"

[rails.manual-heavy-workspace-nextest]
tier = "correctness"
command = "./scripts/cargow nextest run --workspace --all-features --locked --message-format libtest-json-plus --message-format-version 0.1"
target_kind = "integration"
workflow = ".circleci/config.yml"
job = "heavy-correctness"
step = "rust nextest authority receipt"

[rails.pr-proof-authority-python]
tier = "pr"
command = "uv run --frozen --extra dev just proof-p00-authority-freeze"
target_kind = "python"
workflow = ".circleci/config.yml"
job = "verify-python"
step = "P00 authority owner tests"

[rails.pr-benchmark-control-python]
tier = "pr"
command = "uv run --frozen --extra dev python -m pytest tools -q --ignore=tools/ci/tests/test_semgrep_policy.py --ignore=tools/ci/tests/test_check_rust_fallbacks.py -x -vv"
target_kind = "python"
workflow = ".circleci/config.yml"
job = "verify-python"
step = "Python policy and tooling tests"

[rails.correctness-fuzz-ipc-request]
tier = "correctness"
command = "cargo +nightly-2026-08-01 fuzz run ipc_request_decode -- -max_total_time=60"
target_kind = "fuzz"
workflow = ".circleci/config.yml"
job = "heavy-correctness"
step = "Fuzz all registered decoders"

[rails.correctness-fuzz-ipc-response]
tier = "correctness"
command = "cargo +nightly-2026-08-01 fuzz run ipc_response_decode -- -max_total_time=60"
target_kind = "fuzz"
workflow = ".circleci/config.yml"
job = "heavy-correctness"
step = "Fuzz all registered decoders"

[rails.correctness-fuzz-search-corpus]
tier = "correctness"
command = "cargo +nightly-2026-08-01 fuzz run search_corpus_ingest_decode -- -dict=dictionaries/search_corpus_ingest.dict -max_total_time=60"
target_kind = "fuzz"
workflow = ".circleci/config.yml"
job = "heavy-correctness"
step = "Fuzz all registered decoders"

[rails.correctness-fuzz-lq-parse]
tier = "correctness"
command = "cargo +nightly-2026-08-01 fuzz run lq_parse_pipeline -- -max_total_time=60"
target_kind = "fuzz"
workflow = ".circleci/config.yml"
job = "heavy-correctness"
step = "Fuzz all registered decoders"

# Local scopes reuse the authoritative target IDs below. The runner expands a
# scope into one cargo-nextest process, so adding a second hand-maintained path
# or invoking Cargo once per test binary is unnecessary. CI authority remains
# the workspace-wide rails above.
