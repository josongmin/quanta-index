# Test authority SSOT (QIT-00).
#
# A target is not considered covered merely because a broad command happens to
# discover it today. Every Cargo integration binary and cargo-fuzz target must
# be named here with its owning crate and an executable CI rail. The companion
# guard fails when the filesystem, a fuzz manifest, or this catalog diverges.

format_version = 2

[rails.pr-workspace-nextest]
tier = "pr"
command = "./scripts/cargow nextest run --workspace --all-features --locked"
target_kind = "integration"
workflow = ".github/workflows/ci.yml"
job = "rust-test"
step = "rust nextest"

[rails.merge-workspace-nextest]
tier = "merge"
command = "./scripts/cargow nextest run --workspace --all-features --locked"
target_kind = "integration"
workflow = ".github/workflows/ci.yml"
job = "rust-test"
step = "rust nextest"

[rails.nightly-workspace-nextest]
tier = "nightly"
command = "./scripts/cargow nextest run --workspace --all-features --locked"
target_kind = "integration"
workflow = ".github/workflows/correctness.yml"
job = "rust-authority-nextest"
step = "rust nextest authority receipt"

[rails.correctness-fuzz-ipc-request]
tier = "correctness"
command = "cargo +nightly fuzz run ipc_request_decode"
target_kind = "fuzz"
workflow = ".github/workflows/correctness.yml"
job = "rust-fuzz-smoke"
step = "Smoke-run ipc_request_decode (60s)"

[rails.correctness-fuzz-ipc-response]
tier = "correctness"
command = "cargo +nightly fuzz run ipc_response_decode"
target_kind = "fuzz"
workflow = ".github/workflows/correctness.yml"
job = "rust-fuzz-smoke"
step = "Smoke-run ipc_response_decode (60s)"

[rails.correctness-fuzz-search-corpus]
tier = "correctness"
command = "cargo +nightly fuzz run search_corpus_ingest_decode"
target_kind = "fuzz"
workflow = ".github/workflows/correctness.yml"
job = "rust-fuzz-smoke"
step = "Smoke-run search_corpus_ingest_decode (60s)"

[rails.correctness-fuzz-lq-parse]
tier = "correctness"
command = "cargo +nightly fuzz run lq_parse_pipeline"
target_kind = "fuzz"
workflow = ".github/workflows/correctness.yml"
job = "rust-fuzz-smoke"
step = "Smoke-run lq_parse_pipeline (60s)"

