targets:
  agents:
    output: AGENTS.md
    template: templates/agents.md.j2
    description: "Shared AGENTS router"
    max_bytes: 3200
    sections:
      - sources/operational/agent-router.md
      - sources/rules/verification-contract.md

  claude-entrypoint:
    output: CLAUDE.md
    template: templates/claude-entrypoint.md.j2
    description: "Claude Code import adapter for older or restricted sessions"
    max_bytes: 256
    sections:
      - sources/operational/claude-entrypoint.md

  agent-core:
    output: AGENT_CORE.md
    template: templates/agent-core.md.j2
    description: "Core execution rules"
    max_bytes: 2600
    sections:
      - sources/operational/agent-core.md

  agent-playbook:
    output: AGENT_PLAYBOOK.md
    template: templates/agent-playbook.md.j2
    description: "Command selection and verification playbook"
    max_bytes: 6500
    sections:
      - sources/operational/agent-playbook.md
      - sources/operational/compile-boundary-guard.md
      - sources/operational/test-fast-path.md
      - sources/operational/artifacts.md

  agent-rule-catalog:
    output: AGENT_RULE_CATALOG.md
    template: templates/agent-rule-catalog.md.j2
    description: "Full rule catalog and CI mapping"
    max_bytes: 24000
    sections:
      - sources/operational/agent-rule-catalog.md
      - sources/rules/agent-change-posture.md
      - sources/rules/golden-rules.md
      - sources/rules/catalog.md
      - sources/rules/ci-gates.md
