# --------------------------------------------------------------------------
# Profiles. Named, non-overlapping-in-intent execution sets.
# --------------------------------------------------------------------------

[profiles.dsl-authority]
description = "Warm and true-cold DSL latency authority with baseline comparison"
families = ["dsl-warm", "dsl-cold"]

[profiles.dsl-diagnostic]
description = "DSL producer smoke on a non-canonical host; never a speed claim"
families = ["micro-searchd-runtime-dsl-query-matrix"]

[profiles.quality-core]
description = "Core search quality, scale and latency-tail evidence"
families = ["relevance", "ambiguity", "snippet", "scale", "tail"]

[profiles.quality-full]
description = "All live search-quality authority rails"
families = [
    "relevance",
    "ambiguity",
    "snippet",
    "scale",
    "tail",
    "ann",
    "concurrency",
    "freshness",
    "open-loop",
    "ops",
    "ui",
]

[profiles.systems]
description = "Ingest freshness and offered-load diagnostic evidence"
families = ["freshness", "open-loop"]

[profiles.semantic-ab]
description = "Provider semantic A/B capture; requires OPENAI_API_KEY"
families = ["relevance-openai-ab"]

[profiles.micro]
description = "Crate-local Criterion microbenchmarks"
families = ["micro-lq-norm-pipeline", "micro-searchd-runtime-dsl-query-matrix"]

[profiles.retrieval-contract]
description = "Retrieval SDK and contract proof rails"
families = ["retrieval-sdk", "retrieval-contract"]

[profiles.retrieval-diagnostic]
description = "Retrieval paired capture diagnostics; requires external corpus"
families = ["retrieval-pair"]

[profiles.lexical-diagnostic]
description = "Five-product bare-symbol file diagnostic; separate capture inputs and timing layers"
families = ["lexical-file-comparison"]

[profiles.recorded]
description = "Recorded-only evaluation; no producer is allowed to manufacture input"
families = ["agent-outcome", "scan-vs-index"]
