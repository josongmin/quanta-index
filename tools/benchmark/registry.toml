# Single benchmark registration, execution, evidence and verdict registry.
#
# This file is the ONLY data-only control plane for benchmark families. It is
# consumed by:
#   - tools/benchmark/registry.py  (fail-closed Python reader/validator)
#   - benchmarks/bench-protocol    (Rust contract crate, canonical evidence)
#   - tools/benchmark/benchctl.py  (the single current orchestrator CLI)
#   - tools/ci/lint/check-benchmark-policy.py (CI policy guard)
#
# Replacing or moving a producer, validator, scorer, closure or baseline is a
# registry edit. A family that is absent here is not a registered benchmark
# family and cannot be promoted to evidence.
#
# Authority model (BM-03 go/no-go, see docs/plans/sep-26-bench-migration/
# tickets/BM-03-DECISION.md): Python `benchctl` remains the single current
# orchestrator. Producers stay the named Just/cargo/Python owners; domain
# scorers keep their own metric mathematics. Rust owns the typed evidence
# contract (`benchmarks/bench-protocol`) and independently validates the same
# canonical bytes. There is exactly one live CLI.

schema_version = 1

# --------------------------------------------------------------------------
# Source closures. `profile` names a tools/ci/source_closure.py profile.
# --------------------------------------------------------------------------

[closures.benchmark-control-plane]
profile = "benchmark-control-plane"
description = "Normative benchmark protocol, registry, CLI and their owning tests."

[closures.retrieval]
profile = "retrieval"
description = "Rust SDK retrieval producer and its Python scorer/test authority."

[closures.micro]
profile = "benchmark-micro"
description = "Crate-local Criterion benches measured from the product workspace."

# --------------------------------------------------------------------------
# External inputs. Never vendored into Git; bound by digest at replay time.
# --------------------------------------------------------------------------

[external_inputs.corpus-release]
owner = "RBR-12"
description = "Frozen external corpus release (repo commits, file hashes, views)."
required_for = ["retrieval-pair", "retrieval-verdict", "lexical-file-comparison"]
status = "blocked-outside-repo"

[external_inputs.agent-recordings]
owner = "BM-06"
description = "Recorded A/B/C agent trajectory JSONL plus underlying test receipts."
required_for = ["agent-outcome"]
status = "blocked-outside-repo"

[external_inputs.canonical-linux-host]
owner = "platform"
description = "Quiet self-hosted Linux bench host (lease + capture-time load samples)."
required_for = ["dsl-warm", "dsl-cold"]
status = "blocked-outside-repo"

