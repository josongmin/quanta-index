[package]
name = "quanta-census-syn"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quanta-census-syn"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.151"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls"] }

[workspace]
