[package]
name = "quanta-index-scan-experiment"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Exploratory scaling experiment (indexed query vs full-text scan). It builds
# the lexical track under real catalog-owned source and document ID reservations,
# then queries the lexical adapter in-process. It does not run searchd.
# Never gated; see tools/benchmark/run_scan_vs_index.py.
[[bin]]
name = "scan_vs_index"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = { workspace = true }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane" }
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic" }
# The one benchmark artifact envelope (`BenchArtifactV1`) and its
# provenance (exact head, digests, host, peak RSS) live in the harness.
quanta-index-searchd-harness = { version = "0.1.0", path = "../quanta-index-searchd-harness" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
