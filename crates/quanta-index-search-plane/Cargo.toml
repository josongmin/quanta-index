[package]
name = "quanta-index-search-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Only runtime process fixtures install this barrier. Normal runtime builds
# never enable it through their regular search-plane dependency.
test-runtime-barriers = []

[lints]
workspace = true

[dependencies]
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
quanta-index-lq-bridge = { version = "0.1.0", path = "../quanta-index-lq-bridge" }
quanta-index-lq-norm = { version = "0.1.0", path = "../quanta-index-lq-norm" }
quanta-index-lq-obs = { version = "0.1.0", path = "../quanta-index-lq-obs" }
quanta-index-lq-regex = { version = "0.1.0", path = "../quanta-index-lq-regex" }
quanta-index-lq-text-normalizer = { version = "0.1.0", path = "../quanta-index-lq-text-normalizer" }
imbl = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
rustix.workspace = true

[dev-dependencies]
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical" }
tempfile.workspace = true
