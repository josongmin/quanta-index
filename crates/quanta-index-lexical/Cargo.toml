[package]
name = "quanta-index-lexical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native lexical index and read-only Legacy DATA support"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ciborium = { workspace = true }
memchr = { workspace = true }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-lq-positions = { version = "0.1.0", path = "../quanta-index-lq-positions" }
quanta-index-lq-regex = { version = "0.1.0", path = "../quanta-index-lq-regex" }
quanta-index-lq-text-normalizer = { version = "0.1.0", path = "../quanta-index-lq-text-normalizer" }
quanta-index-lq-trigram = { version = "0.1.0", path = "../quanta-index-lq-trigram" }
quanta-index-scratch-sqlite = { version = "0.1.0", path = "../quanta-index-scratch-sqlite" }
regex = { workspace = true }
regex-automata = { workspace = true }
regex-syntax = { workspace = true }
roaring = { workspace = true }
rusqlite = { workspace = true, features = ["cache"] }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
unicode-normalization = { workspace = true }

[build-dependencies]
quanta-index-lq-text-normalizer = { version = "0.1.0", path = "../quanta-index-lq-text-normalizer" }
unicode-normalization = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["resource"] }
quanta-index-searchd-harness = { version = "0.1.0", path = "../quanta-index-searchd-harness", default-features = false }
quanta-index-sdk = { version = "0.1.0", path = "../quanta-index-sdk", default-features = false }
