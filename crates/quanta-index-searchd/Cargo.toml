[package]
name = "quanta-index-searchd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
fs2.workspace = true
memchr.workspace = true
# Name resolution for the socket access knobs (`getgrnam_r` / `getpwnam_r`,
# QI-BB-014) and the process resident-memory probe (`getrusage`, QI-BB-016);
# the safe wrapper, so this crate stays free of `unsafe`.
nix = { workspace = true, features = ["resource"] }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-embed = { version = "0.1.0", path = "../quanta-index-embed" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
quanta-index-lq-regex = { version = "0.1.0", path = "../quanta-index-lq-regex" }
quanta-index-lq-structural = { version = "0.1.0", path = "../quanta-index-lq-structural" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false }
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic" }
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
ciborium = { workspace = true }
tempfile = { workspace = true }
