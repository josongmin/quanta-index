[package]
name = "quanta-index-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Driving adapter for search-plane IPC transport (CBOR + UDS)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Process-scoped test observation of actual Native client send attempts.
native-send-observer-v1 = []

[dependencies]
ciborium = { workspace = true }
ciborium-ll = { workspace = true }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
rustix = { workspace = true, features = ["event", "net", "process"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

# `getpeereid(3)` for the peer-credential check (QI-BB-014): rustix has no
# wrapper on the BSDs, nix's is the safe one. Linux retains rustix's
# SO_PEERCRED and uses the same pinned nix for the safe OwnedFd PeerPidfd option.
[target.'cfg(any(target_os = "linux", target_vendor = "apple", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
nix = { workspace = true }

# The connected process retains an observed image FD, not another image pin.
[target.'cfg(target_os = "linux")'.dependencies]
quanta-explicit-fd-process = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
