[package]
name = "quanta-index-searchd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false
default-run = "quanta-index-searchd"

[[bin]]
name = "quanta-index-searchd"
path = "src/bin/quanta-index-searchd.rs"
doc = false
bench = false

[[bin]]
name = "quanta-index-searchd-fixture"
path = "src/bin/quanta-index-searchd-fixture.rs"
required-features = ["native-test-fixtures"]
doc = false
bench = false
test = false

[[test]]
name = "runtime_fast_suite"
path = "tests/runtime_fast_suite.rs"

[[test]]
name = "runtime_semantic_stream_suite"
path = "tests/runtime_semantic_stream_suite.rs"

[[test]]
name = "runtime_supervisor_owner_v1"
path = "tests/runtime_supervisor_owner_v1.rs"

[[test]]
name = "process_readiness_owner_v1"
path = "tests/process_readiness_owner_v1.rs"

[[test]]
name = "legacy_crash_compat"
path = "tests/legacy_crash_compat.rs"

[[test]]
name = "native_graph_uds"
path = "tests/native_graph_uds.rs"

[[test]]
name = "native_overlay_uds"
path = "tests/native_overlay_uds.rs"

[[test]]
name = "native_index_uds"
path = "tests/native_index_uds.rs"

[[test]]
name = "native_source_owner_lookup"
path = "tests/native_source_owner_lookup.rs"

[[test]]
name = "native_producer_source_recovery"
path = "tests/native_producer_source_recovery.rs"

[[test]]
name = "native_effort"
path = "tests/native_effort.rs"

[[test]]
name = "native_product_process"
path = "tests/native_product_process.rs"

[lints]
workspace = true

[features]
legacy-semantic-adapter = ["quanta-index-semantic/qualified-memory-uri-candidate"]
sqlite-owner-vfs-grant = ["dep:quanta-sqlite-retained-grant"]
qualified-memory-uri-candidate = ["legacy-semantic-adapter"]
native-test-fixtures = []

[dependencies]
ciborium.workspace = true
anyhow.workspace = true
signal-hook.workspace = true
quanta-index-catalog = { version = "0.1.0", path = "../quanta-index-catalog" }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-embed = { version = "0.1.0", path = "../quanta-index-embed" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
quanta-index-kernel = { version = "0.1.0", path = "../quanta-index-kernel" }
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical", default-features = false }
quanta-index-repomap = { version = "0.1.0", path = "../quanta-index-repomap" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd" }
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic", default-features = false }
quanta-index-storage = { version = "0.1.0", path = "../quanta-index-storage" }
rusqlite.workspace = true
reqwest.workspace = true
serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "process", "net", "time"] }

[[bench]]
name = "dsl_query_matrix"
harness = false

[dev-dependencies]
lance = { workspace = true }
lance-io.workspace = true
quanta-index-scratch-sqlite = { version = "0.1.0", path = "../quanta-index-scratch-sqlite" }
object_store = { workspace = true }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd", features = ["test-provider-transport"] }
criterion = { workspace = true }
quanta-index-corpus-smoke = { version = "0.1.0", path = "../quanta-index-corpus-smoke" }
quanta-index-sdk = { version = "0.1.0", path = "../quanta-index-sdk" }
quanta-index-searchctl = { version = "0.1.0", path = "../quanta-index-searchctl" }
# The fixture API is available to integration tests through the dev graph.
quanta-index-searchd-runtime = { version = "0.1.0", path = ".", default-features = false, features = ["native-test-fixtures"] }
quanta-index-searchd-harness = { version = "0.1.0", path = "../quanta-index-searchd-harness", default-features = false }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false, features = ["test-runtime-barriers"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile.workspace = true
toml = { workspace = true }

[[test]]
name = "native_owned_pump"
path = "tests/native_owned_pump.rs"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
quanta-sqlite-retained-grant = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
quanta-explicit-fd-process.workspace = true
quanta-installed-artifact-trust = { workspace = true, features = ["s-product-startup-v1"] }
fs2.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
quanta-state-root-quota.workspace = true
