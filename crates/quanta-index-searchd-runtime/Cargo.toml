[package]
name = "quanta-index-searchd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "quanta-index-searchd"
path = "src/bin/quanta-index-searchd.rs"
doc = false
bench = false

[[test]]
name = "runtime_fast_suite"
path = "tests/runtime_fast_suite.rs"

[[test]]
name = "l4_preview_sdk"
path = "tests/l4_preview_sdk.rs"

[[test]]
name = "runtime_risk_suite"
path = "tests/runtime_risk_suite.rs"

[[test]]
name = "runtime_extended_suite"
path = "tests/runtime_extended_suite.rs"

[[test]]
name = "runtime_semantic_stream_suite"
path = "tests/runtime_semantic_stream_suite.rs"

[[test]]
name = "runtime_supervisor_owner_v1"
path = "tests/runtime_supervisor_owner_v1.rs"

[[test]]
name = "process_readiness_owner_v1"
path = "tests/process_readiness_owner_v1.rs"

[[test]]
name = "state_migration_owner_v1"
path = "tests/state_migration_owner_v1.rs"

[[test]]
name = "native_graph_uds"
path = "tests/native_graph_uds.rs"

[[test]]
name = "native_overlay_uds"
path = "tests/native_overlay_uds.rs"

[[test]]
name = "native_index_uds"
path = "tests/native_index_uds.rs"

[[test]]
name = "native_source_owner_lookup"
path = "tests/native_source_owner_lookup.rs"

[[test]]
name = "native_producer_source_recovery"
path = "tests/native_producer_source_recovery.rs"

[[test]]
name = "native_effort"
path = "tests/native_effort.rs"

[[test]]
name = "native_product_process"
path = "tests/native_product_process.rs"

[lints]
workspace = true

[dependencies]
lance-io.workspace = true
anyhow.workspace = true
signal-hook.workspace = true
quanta-index-catalog = { version = "0.1.0", path = "../quanta-index-catalog" }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-embed = { version = "0.1.0", path = "../quanta-index-embed" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
quanta-index-kernel = { version = "0.1.0", path = "../quanta-index-kernel" }
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical" }
quanta-index-repomap = { version = "0.1.0", path = "../quanta-index-repomap" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd" }
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic" }
quanta-index-storage = { version = "0.1.0", path = "../quanta-index-storage" }
rusqlite.workspace = true
reqwest.workspace = true
serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }

[[bench]]
name = "dsl_query_matrix"
harness = false

[dev-dependencies]
quanta-index-scratch-sqlite = { version = "0.1.0", path = "../quanta-index-scratch-sqlite" }
object_store = { version = "=0.13.2", default-features = false }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd", features = ["test-provider-transport"] }
ciborium = { workspace = true }
criterion = { workspace = true }
quanta-index-corpus-smoke = { version = "0.1.0", path = "../quanta-index-corpus-smoke" }
quanta-index-sdk = { version = "0.1.0", path = "../quanta-index-sdk" }
quanta-index-searchctl = { version = "0.1.0", path = "../quanta-index-searchctl" }
quanta-index-searchd-harness = { version = "0.1.0", path = "../quanta-index-searchd-harness" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false, features = ["test-runtime-barriers"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile.workspace = true
toml = { workspace = true }

[[test]]
name = "active_selection_process_v1"
path = "tests/active_selection_process_v1.rs"

[[test]]
name = "native_owned_pump"
path = "tests/native_owned_pump.rs"

[target.'cfg(unix)'.dependencies]
libsqlite3-sys = { version = "=0.38.2", features = ["quanta-capacity-vfs"] }

[target.'cfg(unix)'.dev-dependencies]
libsqlite3-sys = { version = "=0.38.2", features = ["quanta-capacity-vfs-test-hooks"] }
