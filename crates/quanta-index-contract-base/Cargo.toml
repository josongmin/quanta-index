[package]
name = "quanta-index-contract-base"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
quanta-native-identity-v1 = ["dep:quanta-index-unicode"]

[dependencies]
quanta-index-unicode = { version = "0.1.0", path = "../quanta-index-unicode", optional = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
ciborium = { workspace = true }
serde_json = { workspace = true }
