[package]
name = "quanta-index-searchd-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dsl_cold_matrix"
path = "src/bin/dsl_cold_matrix.rs"
doc = false

[dependencies]
anyhow = { workspace = true }
# Safe `getrusage(2)` (peak RSS) and `gethostname(2)` for the benchmark
# artifact's resource and host provenance (QI-BB-010).
nix = { workspace = true, features = ["resource", "hostname", "fs"] }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-embed = { version = "0.1.0", path = "../quanta-index-embed" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
# The scale rail opens the daemon's sealed lexical generation in-process to
# time the adapter-only open and execute phases beside the daemon's.
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical" }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd" }
quanta-index-searchd-runtime = { version = "0.1.0", path = "../quanta-index-searchd-runtime" }
# The ANN rail seals and queries a semantic generation through the adapter
# itself: the production build, seal and open, with no daemon between.
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
