[package]
name = "quanta-index-searchd-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
semantic-bench = ["quanta-index-semantic/legacy-semantic-adapter"]

[lints]
workspace = true

[[bin]]
name = "dsl_cold_matrix"
path = "src/bin/dsl_cold_matrix.rs"
doc = false

[dependencies]
anyhow = { workspace = true }
# Benchmark resource and host provenance, plus cooperative fixture shutdown.
nix = { workspace = true, features = ["resource", "hostname", "fs", "signal"] }
quanta-index-contract = { version = "0.1.0", path = "../quanta-index-contract" }
quanta-index-core = { version = "0.1.0", path = "../quanta-index-core" }
quanta-index-embed = { version = "0.1.0", path = "../quanta-index-embed" }
quanta-index-ipc = { version = "0.1.0", path = "../quanta-index-ipc" }
# The scale rail opens the daemon's sealed lexical generation in-process to
# time the adapter-only open and execute phases beside the daemon's.
quanta-index-lexical = { version = "0.1.0", path = "../quanta-index-lexical", default-features = false }
quanta-index-search-plane = { version = "0.1.0", path = "../quanta-index-search-plane", default-features = false }
quanta-index-searchd = { version = "0.1.0", path = "../quanta-index-searchd" }
quanta-index-sdk = { version = "0.1.0", path = "../quanta-index-sdk" }
# Native corpus generation needs pure embedding helpers. The direct persisted
# ANN benchmark enables its adapter through semantic-bench.
quanta-index-semantic = { version = "0.1.0", path = "../quanta-index-semantic", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

# Native child RSS only; no proc_pidinfo generic or Linux libproc fallback.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = { workspace = true }

[[bin]]
name = "ambiguity_matrix"
path = "src/bin/ambiguity_matrix.rs"

[[bin]]
name = "ann_matrix"
path = "src/bin/ann_matrix.rs"
required-features = ["semantic-bench"]

[[bin]]
name = "concurrency_matrix"
path = "src/bin/concurrency_matrix.rs"

[[bin]]
name = "dsl_warm_matrix"
path = "src/bin/dsl_warm_matrix.rs"

[[bin]]
name = "freshness_matrix"
path = "src/bin/freshness_matrix.rs"

[[bin]]
name = "open_loop_matrix"
path = "src/bin/open_loop_matrix.rs"

[[bin]]
name = "ops_matrix"
path = "src/bin/ops_matrix.rs"

[[bin]]
name = "relevance_matrix"
path = "src/bin/relevance_matrix.rs"

[[bin]]
name = "relevance_openai_ab"
path = "src/bin/relevance_openai_ab.rs"

[[bin]]
name = "snippet_matrix"
path = "src/bin/snippet_matrix.rs"

[[bin]]
name = "tail_matrix"
path = "src/bin/tail_matrix.rs"

[[bin]]
name = "ui_matrix"
path = "src/bin/ui_matrix.rs"
